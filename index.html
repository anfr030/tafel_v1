<style>
/* Layout: Abfahrtstafeln links als 2×2-Raster, Wetterspalte rechts; im Hochformat Wetter oben. Eine Schrift (Archivo) in drei Breiten. */
:root {
  --bg: #E9EEF0;
  --surface: #FFFFFF;
  --line: #D5DDE1;
  --fg: #111A1F;
  --muted: #5A6A73;
  --faint: #98A6AD;
  --accent: #A96500;
  --late: #BF3B25;
  --warn-bg: #FFF0CF;
  --warn-fg: #5F3B00;
  --severe-bg: #FADCD5;
  --severe-fg: #741A0D;
  --badge-dim: 1;
  --f: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #151D22; --line: #22303A; --fg: #E2E9EC; --muted: #8798A2; --faint: #51616B;
    --accent: #F2B544; --late: #FF7B64; --warn-bg: #362A0F; --warn-fg: #F5D48D; --severe-bg: #3B1611; --severe-fg: #FFB3A4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #151D22; --line: #22303A; --fg: #E2E9EC; --muted: #8798A2; --faint: #51616B;
  --accent: #F2B544; --late: #FF7B64; --warn-bg: #362A0F; --warn-fg: #F5D48D; --severe-bg: #3B1611; --severe-fg: #FFB3A4;
  color-scheme: dark;
}
:root[data-night="1"] {
  --bg: #050708; --surface: #0A0D10; --line: #141B20; --fg: #8F9CA3; --muted: #56636B; --faint: #333D44;
  --accent: #A9792A; --late: #A9574A; --warn-bg: #1E170A; --warn-fg: #A68E5E; --severe-bg: #200C09; --severe-fg: #A97A71;
  --badge-dim: 0.55;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f);
  font-size: clamp(14px, 1.5vmax, 22px); line-height: 1.25;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
  gap: 0.8rem;
  padding-block: max(0.8rem, env(safe-area-inset-top, 0px)) max(0.8rem, env(safe-area-inset-bottom, 0px));
  padding-left: max(0.8rem, env(safe-area-inset-left, 0px));
  padding-right: max(0.8rem, env(safe-area-inset-right, 0px));
}
.boards {
  min-width: 0; min-height: 0;
  display: grid; gap: 0.8rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
}
.boards[data-n="1"] { grid-template-columns: minmax(0, 1fr); }

/* Tafel */
.board {
  min-width: 0; min-height: 0; overflow: hidden;
  background: var(--surface); border-radius: 14px;
  padding: 0.8rem 0.9rem;
  display: flex; flex-direction: column; gap: 0.45rem;
}
.b-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
.b-title { font-weight: 680; font-size: 1.05em; font-stretch: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.b-meta { color: var(--muted); font-size: 0.72em; white-space: nowrap; letter-spacing: 0.02em; }
.b-meta .stale { color: var(--late); font-weight: 600; }
.b-note {
  display: flex; gap: 0.4em; align-items: flex-start;
  font-size: 0.72em; color: var(--warn-fg); background: var(--warn-bg);
  border-radius: 8px; padding: 0.3em 0.55em;
}
.b-note span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.b-note svg { flex: none; width: 1.1em; height: 1.1em; margin-top: 0.05em; }
.rows { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; min-height: 0; }
.row > .c + .c { padding-left: 0.65em; }
.row { display: contents; }
.row > .c { display: flex; align-items: center; min-width: 0; padding: 0.42em 0; border-top: 1px solid var(--line); }
.row:first-child > .c { border-top: 0; }
.row > .c.r { justify-content: flex-end; }
.badge {
  justify-self: start; min-width: 2.9em; text-align: center;
  font-weight: 760; font-size: 0.86em; letter-spacing: 0.01em;
  color: #fff; border-radius: 6px; padding: 0.16em 0.4em;
  filter: brightness(var(--badge-dim));
}
.badge.tram { border-radius: 2px; }
.dest { display: block; font-stretch: 78%; font-weight: 520; font-size: 1.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { font-weight: 640; font-size: 1.04em; white-space: nowrap; text-align: right; }
.time .dl { font-size: 0.72em; font-weight: 700; color: var(--late); margin-left: 0.2em; vertical-align: 0.15em; }
.time .dl.ok { color: var(--muted); font-weight: 500; }
.go { text-align: right; font-size: 0.8em; color: var(--muted); white-space: nowrap; }
.row.next .go { color: var(--accent); font-weight: 720; }
.row.next .dest { font-weight: 640; }
.row.now .go { color: var(--accent); font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; font-size: 0.74em; }
.row.gone > .c { opacity: 0.38; }
.row.plan .time { font-style: italic; font-weight: 500; }
.row.cancel .dest, .row.cancel .time { text-decoration: line-through; }
.row.cancel .go { color: var(--late); font-weight: 650; }
.empty { grid-column: 1 / -1; color: var(--muted); font-size: 0.85em; padding: 0.6em 0; }

/* Wetterspalte */
.side {
  min-width: 0; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 0.8rem;
}
.clock { padding: 0.1rem 0.2rem 0; }
.clock .hm { font-size: 3.4em; font-weight: 300; font-stretch: 112%; line-height: 0.95; letter-spacing: -0.02em; }
.clock .dt { color: var(--muted); font-size: 0.86em; margin-top: 0.35em; }
#w-day { display: flex; flex-direction: column; }
#w-day .chart { margin-top: auto; }
.card { background: var(--surface); border-radius: 14px; padding: 0.85rem 0.95rem; min-width: 0; }
.alerts { display: flex; flex-direction: column; gap: 0.5rem; }
.alert { border-radius: 12px; padding: 0.6rem 0.8rem; background: var(--warn-bg); color: var(--warn-fg); }
.alert.severe { background: var(--severe-bg); color: var(--severe-fg); }
.alert .a-k { font-size: 0.66em; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; opacity: 0.85; }
.alert .a-t { font-weight: 700; font-size: 0.95em; margin-top: 0.15em; }
.alert .a-w { font-size: 0.74em; margin-top: 0.15em; }
.now-w { display: flex; align-items: center; gap: 0.7rem; }
.now-w svg { width: 3.2em; height: 3.2em; flex: none; color: var(--fg); }
.temp { font-size: 3.1em; font-weight: 320; font-stretch: 115%; line-height: 1; letter-spacing: -0.02em; }
.cond { color: var(--muted); font-size: 0.8em; margin-top: 0.3em; }
.cond b { color: var(--fg); font-weight: 600; }
.lbl { font-size: 0.64em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 650; }
.rain-s { font-weight: 620; font-size: 0.98em; margin: 0.35em 0 0.55em; text-wrap: balance; }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 2.2em; align-items: end; }
.strip i { display: block; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.9; }
.strip i.zero { background: var(--line); }
.strip-ax { display: flex; justify-content: space-between; font-size: 0.62em; color: var(--muted); margin-top: 0.3em; }
.strip-src { font-size: 0.6em; color: var(--faint); margin-top: 0.25em; }
.chart { width: 100%; height: auto; display: block; margin-top: 0.4em; overflow: visible; }
.chart .ln { fill: none; stroke: var(--fg); stroke-width: 1.6; }
.chart .ar { fill: var(--fg); opacity: 0.07; }
.chart .gr { stroke: var(--line); stroke-width: 1; }
.chart .tx { fill: var(--muted); font-size: 9px; font-family: var(--f); }
.chart .tv { fill: var(--fg); font-size: 10px; font-weight: 650; font-family: var(--f); }
.chart .dt { fill: var(--fg); }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 0.6rem; color: var(--faint); font-size: 0.6em; }
.gear {
  flex: none; border: 0; background: transparent; color: var(--faint);
  width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
}
.gear svg { width: 1.4rem; height: 1.4rem; }
.gear:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Hochformat */
@media (orientation: portrait) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { order: -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
  .side .clock, .side .alerts { grid-column: 1 / -1; }
  .side .foot { grid-column: 1 / -1; margin-top: 0; }
  .clock { display: flex; align-items: baseline; gap: 0.9rem; }
  .clock .hm { font-size: 2.6em; }
}
/* Schmale Bildschirme: eine Spalte, scrollbar */
@media (max-width: 700px) {
  body { overflow: auto; }
  .app { height: auto; }
  .boards { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  .side { grid-template-columns: minmax(0, 1fr); }
}

/* Einstellungen */
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; user-select: text; -webkit-user-select: text;
  padding-block: max(1rem, env(safe-area-inset-top, 0px)) max(2rem, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 17px;
}
.sheet-in { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); padding: 0.4rem 0; z-index: 2; }
.sheet h1 { font-size: 1.5rem; font-weight: 700; margin: 0; font-stretch: 95%; }
.sheet h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 0.6rem; }
.sec { background: var(--surface); border-radius: 14px; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; }
.fld { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
.fld > span { font-size: 0.8rem; color: var(--muted); }
.fld small { font-size: 0.75rem; color: var(--faint); }
input[type=text], input[type=number], input[type=search], textarea, select {
  width: 100%; min-width: 0; padding: 0.55rem 0.7rem; border-radius: 9px;
  border: 1px solid var(--line); background: var(--bg);
}
textarea { font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; min-height: 7rem; resize: vertical; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
  padding: 0.5rem 0.85rem; cursor: pointer; white-space: nowrap;
}
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 650; }
.btn.danger { color: var(--late); }
.btn.armed { background: var(--late); border-color: var(--late); color: var(--bg); }
.btn.sm { padding: 0.3rem 0.6rem; font-size: 0.85rem; }
.btns { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.ed { border: 1px solid var(--line); border-radius: 12px; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.8rem; }
.ed-head { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.ed-head input { flex: 1 1 14rem; font-weight: 650; }
.pick { display: flex; gap: 0.5rem; }
.pick input { flex: 1; }
.cur { font-size: 0.85rem; }
.cur b { font-weight: 650; }
.cur em { color: var(--faint); font-style: normal; font-size: 0.8em; }
.res { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.res .btn { font-size: 0.85rem; }
.res .p { color: var(--muted); font-size: 0.8em; margin-left: 0.3em; }
.chk { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; }
.chk label { display: flex; gap: 0.35rem; align-items: center; font-size: 0.9rem; }
.msg { font-size: 0.85rem; color: var(--accent); }
.radio { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.radio label { display: flex; align-items: center; gap: 0.3rem; border: 1px solid var(--line); border-radius: 9px; padding: 0.4rem 0.7rem; font-size: 0.9rem; }

@media (prefers-reduced-motion: no-preference) {
  .row > .c { transition: opacity 0.6s; }
}
</style>
</head>
<body>
<main class="app" id="app">
  <section class="boards" id="boards" aria-label="Abfahrten"></section>
  <aside class="side" id="side" aria-label="Wetter">
    <div class="clock"><div class="hm" id="hm">--:--</div><div class="dt" id="dt"></div></div>
    <div class="alerts" id="alerts"></div>
    <div class="card" id="w-now"><div class="lbl">Jetzt</div><div class="cond">Wetterdaten werden geladen …</div></div>
    <div class="card" id="w-rain"><div class="lbl">Regen · nächste 12 Std.</div><div class="rain-s">…</div></div>
    <div class="card" id="w-day"><div class="lbl">Temperatur · 24 Std.</div></div>
    <div class="foot">
      <div id="src">Fahrplandaten: VBB via transport.rest<br>Wetter: Deutscher Wetterdienst via Bright Sky</div>
      <button class="gear" id="gear" aria-label="Einstellungen öffnen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg>
      </button>
    </div>
  </aside>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div>

<script>
(function () {
"use strict";

/* ---------- Konfiguration ---------- */
const KEY = "tafel.config.v1";

const clone = (o) => JSON.parse(JSON.stringify(o));
function loadConfig() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const c = JSON.parse(raw);
      if (c && Array.isArray(c.boards)) return Object.assign(clone(DEFAULTS), c);
    }
  } catch (e) {}
  return clone(DEFAULTS);
}
function saveConfig(c) {
  try { localStorage.setItem(KEY, JSON.stringify(c)); return true; } catch (e) { return false; }

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function getJSON(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);
  try {
    const r = await fetch(url, { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(t); }
}

function badgeStyle(line) {
  const name = (line && line.name || "").replace(/\s+/g, "").toUpperCase();
  const bg = LINE_COLORS[name] || PRODUCT_COLORS[line && line.product] || "#5A6A73";
  const fg = name === "U4" ? "#111" : "#fff";
  return "background:" + bg + ";color:" + fg;
}
function cleanDest(s) {
  return String(s || "")
    .replace(/\s*\(Berlin\)\s*/g, " ")
    .replace(/^S\+U\s+/, "").replace(/^S\s+/, "").replace(/^U\s+/, "")
    .replace(/\s+Bhf\.?$/, "").replace(/\s+/g, " ").trim();
}
function cleanDestFor(dest, line) {
  const l = String(line || "").replace(/[.*+?^${}()|[\]\\]/g, "");
  const out = l ? dest.replace(new RegExp("(^|\\s)" + l + "(?=\\s|$)"), " ").replace(/\s+/g, " ").trim() : dest;
  return out || dest;
}
const normLine = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
const parseLines = (s) => String(s || "").split(/[,;\s]+/).map(normLine).filter(Boolean);

/* Sonnenauf-/-untergang (nach SunCalc, V. Agafonkin) */
function sunTimes(date, lat, lng) {
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
  const toDays = (d) => d.valueOf() / 86400000 - 0.5 + J1970 - J2000;
  const fromJ = (j) => new Date((j + 0.5 - J1970) * 86400000);
  const lw = rad * -lng, phi = rad * lat, d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const h0 = -0.833 * rad;
  const w = Math.acos((Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const a = J0 + (w + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}

/* ---------- Darstellung: Theme & Nachtmodus ---------- */
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  const root = document.documentElement;
  const now = new Date();
  const st = sunTimes(now, cfg.place.lat, cfg.place.lon);
  const night = now < new Date(st.rise.getTime() - 20 * 60000) || now > new Date(st.set.getTime() + 30 * 60000);
  let theme = cfg.theme;
  if (theme === "auto") theme = mq && mq.matches ? "dark" : "light";
  root.setAttribute("data-theme", theme);
  if (cfg.nightDim && night) root.setAttribute("data-night", "1"); else root.removeAttribute("data-night");
}
if (mq && mq.addEventListener) mq.addEventListener("change", applyTheme);

async function resolveStop(ref, products) {
  if (!ref) return null;
  if (ref.id) return ref.id;
  const url = cfg.api + "/locations?query=" + encodeURIComponent(ref.name) + "&results=8&poi=false&addresses=false&linesOfStops=false&language=de";
  const list = await getJSON(url);
  const arr = Array.isArray(list) ? list : [];
  const stops = arr.filter((x) => x && (x.type === "stop" || x.type === "station") && x.id);
  const want = products && products.length ? products : null;
  const hit = stops.find((s) => !want || want.some((p) => s.products && s.products[p])) || stops[0];
  if (!hit) throw new Error("Haltestelle „" + ref.name + "“ nicht gefunden");
  ref.id = String(hit.id);
  ref.name = hit.name || ref.name;
  saveConfig(cfg);
  return ref.id;
}

async function loadBoard(bs) {
  const b = bs.cfg;
  try {
    const stopId = await resolveStop(b.stop, b.products);
    const viaId = b.via ? await resolveStop(b.via, null) : null;
    let url = cfg.api + "/stops/" + encodeURIComponent(stopId) + "/departures?duration=60&results=40&remarks=true&language=de&linesOfStops=false";
    const prods = b.products && b.products.length ? b.products : null;
    if (prods) PRODUCTS.forEach(([p]) => { url += "&" + p + "=" + (prods.indexOf(p) >= 0); });
    if (viaId) url += "&direction=" + encodeURIComponent(viaId);
    const data = await getJSON(url);
    const list = Array.isArray(data) ? data : (data && data.departures) || [];
    const want = parseLines(b.lines);
    bs.deps = list
      .filter((d) => d && d.line && (!want.length || want.indexOf(normLine(d.line.name)) >= 0))
      .map((d) => ({
        line: d.line,
        dest: cleanDest(d.direction || (d.destination && d.destination.name)),
        t: new Date(d.when || d.plannedWhen),
        planned: d.plannedWhen ? new Date(d.plannedWhen) : null,
        delay: typeof d.delay === "number" ? d.delay : null,
        cancelled: !!d.cancelled,
        remarks: (d.remarks || []).filter((r) => r && r.type === "warning").map((r) => r.summary || r.text).filter(Boolean)
      }))
      .filter((d) => !isNaN(d.t))
      .sort((a, b2) => a.t - b2.t);
    const seen = new Set();
    bs.notes = [];
    bs.deps.forEach((d) => d.remarks.forEach((r) => { const k = r.slice(0, 80); if (!seen.has(k)) { seen.add(k); bs.notes.push(r); } }));
    bs.lastOk = Date.now();
    bs.error = null;
    bs.nextAt = Date.now() + 30000;
  } catch (e) {
    bs.error = e;
    bs.nextAt = Date.now() + (e && e.status === 429 ? 90000 : 45000);
  }
  renderBoard(bs);
}

function renderBoard(bs) {
  const b = bs.cfg, el = bs.el, now = Date.now();
  el.querySelector(".b-title").textContent = b.title || (b.stop && b.stop.name) || "Tafel";
  const walk = Math.max(0, Number(b.walk) || 0);
  let meta = walk ? walk + " Min. Fußweg" : "";
  const stale = bs.lastOk && now - bs.lastOk > 120000;
  if (stale) meta = '<span class="stale">Stand ' + hm(new Date(bs.lastOk)) + "</span>" + (meta ? " · " + meta : "");
  el.querySelector(".b-meta").innerHTML = meta;

  const note = el.querySelector(".b-note");
  if (bs.notes.length) {
    note.hidden = false;
    note.innerHTML = NOTE_ICON + "<span>" + esc(bs.notes[0]) + "</span>";
  } else note.hidden = true;

  const rows = el.querySelector(".rows");
  const deps = bs.deps.filter((d) => d.t.getTime() > now - 30000).slice(0, Math.max(1, Number(b.count) || 6));
  if (!deps.length) {
    let msg;
    if (bs.error && !bs.lastOk) msg = bs.error.message && bs.error.message.indexOf("nicht gefunden") >= 0
      ? esc(bs.error.message) + ". Bitte in den Einstellungen prüfen."
      : "Keine Verbindung zur Fahrplanauskunft. Neuer Versuch läuft automatisch.";
    else if (!bs.lastOk) msg = "Abfahrten werden geladen …";
    else msg = "Keine Abfahrten in den nächsten 60 Minuten.";
    rows.innerHTML = '<div class="empty">' + msg + "</div>";
    return;
  }
  let nextMarked = false;
  rows.innerHTML = deps.map((d) => {
    const mins = Math.floor((d.t.getTime() - now) / 60000);
    const leave = mins - walk;
    const cls = ["row"];
    let go;
    if (d.cancelled) { cls.push("cancel"); go = "fällt aus"; }
    else if (leave < 0) { cls.push("gone"); go = "zu knapp"; }
    else {
      if (!nextMarked) { cls.push("next"); nextMarked = true; }
      if (leave === 0) { cls.push("now"); go = "jetzt los"; }
      else go = "los in " + leave + " Min";
    }
    if (d.delay === null && !d.cancelled) cls.push("plan");
    const t = d.cancelled && d.planned ? d.planned : d.t;
    let dl = "";
    if (d.delay !== null && !d.cancelled) {
      const m = Math.round(d.delay / 60);
      if (m >= 1) dl = '<span class="dl">+' + m + "</span>";
      else if (m <= -1) dl = '<span class="dl ok">' + m + "</span>";
    }
    const prod = d.line.product === "tram" ? " tram" : "";
    return '<div class="' + cls.join(" ") + '">' +
      '<span class="c"><span class="badge' + prod + '" style="' + badgeStyle(d.line) + '">' + esc(d.line.name) + "</span></span>" +
      '<span class="c"><span class="dest">' + esc(cleanDestFor(d.dest, d.line.name)) + "</span></span>" +
      '<span class="c r time">' + hm(t) + dl + "</span>" +
      '<span class="c r go">' + go + "</span></div>";
  }).join("");
  while (el.scrollHeight > el.clientHeight + 1 && rows.children.length > 2) rows.removeChild(rows.lastElementChild);
}

const BS = "https://api.brightsky.dev";
const weather = { now: null, hourly: null, radar: null, alerts: null, at: {} };
const COND = {
  "clear-day": "Klar", "clear-night": "Klar", "partly-cloudy-day": "Teils bewölkt", "partly-cloudy-night": "Teils bewölkt",
  cloudy: "Bewölkt", fog: "Nebel", wind: "Windig", rain: "Regen", sleet: "Schneeregen", snow: "Schnee", hail: "Hagel", thunderstorm: "Gewitter"
};
function icon(name) {
  const cloud = '<path d="M15 36h19a8 8 0 0 0 .6-16A11 11 0 0 0 13.6 19 8.5 8.5 0 0 0 15 36z"/>';
  const sun = (cx, cy, r) => {
    let s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>';
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, r1 = r + 3, r2 = r + 6.5;
      s += '<path d="M' + (cx + r1 * Math.cos(a)).toFixed(1) + " " + (cy + r1 * Math.sin(a)).toFixed(1) + "L" + (cx + r2 * Math.cos(a)).toFixed(1) + " " + (cy + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    return s;
  };
  const moon = (cx, cy, r) => '<path d="M' + (cx + r * 0.3) + " " + (cy - r) + "A" + r + " " + r + " 0 1 0 " + (cx + r) + " " + (cy + r * 0.35) + "A" + (r * 0.8) + " " + (r * 0.8) + " 0 0 1 " + (cx + r * 0.3) + " " + (cy - r) + 'z"/>';
  let body;
  switch (name) {
    case "clear-day": body = sun(24, 24, 8); break;
    case "clear-night": body = moon(22, 24, 11); break;
    case "partly-cloudy-day": body = '<g transform="translate(-6 -6) scale(.8)">' + sun(24, 24, 7) + "</g>" + '<g transform="translate(4 4) scale(.9)">' + cloud + "</g>"; break;
    case "partly-cloudy-night": body = '<g transform="translate(-4 -6) scale(.75)">' + moon(22, 24, 10) + "</g>" + '<g transform="translate(4 4) scale(.9)">' + cloud + "</g>"; break;
    case "rain": body = '<g transform="translate(0 -5)">' + cloud + '</g><path d="M17 37l-2 5M25 37l-2 5M33 37l-2 5"/>'; break;
    case "sleet": body = '<g transform="translate(0 -5)">' + cloud + '</g><path d="M17 37l-2 5M31 37l-2 5"/><circle cx="24" cy="40" r=".9"/>'; break;
    case "snow": case "hail": body = '<g transform="translate(0 -5)">' + cloud + '</g><circle cx="17" cy="39" r="1"/><circle cx="24" cy="42" r="1"/><circle cx="31" cy="39" r="1"/>'; break;
    case "thunderstorm": body = '<g transform="translate(0 -5)">' + cloud + '</g><path d="M25 33l-4 6h5l-3 6"/>'; break;
    case "fog": body = '<path d="M9 18h30M6 25h36M10 32h28M14 39h20"/>'; break;
    case "wind": body = '<path d="M6 19h22a5 5 0 1 0-5-5M6 27h31a5 5 0 1 1-5 5M6 35h16"/>'; break;
    default: body = cloud;
  }
  return '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + "</svg>";
}

const qs = () => "lat=" + cfg.place.lat + "&lon=" + cfg.place.lon + "&tz=" + encodeURIComponent(TZ);
async function loadCurrent() {

  renderWeather();
}
async function loadHourly() {
  try {
    const from = new Date(Date.now() - 3600000), to = new Date(Date.now() + 26 * 3600000);
    const d = await getJSON(BS + "/weather?" + qs() + "&date=" + encodeURIComponent(from.toISOString()) + "&last_date=" + encodeURIComponent(to.toISOString()));
    weather.hourly = (d.weather || []).map((w) => ({ t: new Date(w.timestamp), temp: w.temperature, pp: w.precipitation_probability, mm: w.precipitation, icon: w.icon })).filter((w) => typeof w.temp === "number");
    weather.at.hourly = Date.now();
  } catch (e) {}

async function loadRadar() {
  try {
    const d = await getJSON(BS + "/radar?" + qs() + "&distance=2000&format=plain", 20000);
    const pos = d.latlon_position;
    weather.radar = (d.radar || []).map((r) => {
      const g = r.precipitation_5 || [];
      let v = 0;
      if (g.length) {
        const y = pos ? Math.min(g.length - 1, Math.max(0, Math.round(pos.y))) : Math.floor(g.length / 2);
        const row = g[y] || [];
        const x = pos ? Math.min(row.length - 1, Math.max(0, Math.round(pos.x))) : Math.floor(row.length / 2);
        v = Number(row[x]) || 0;
      }
      return { t: new Date(r.timestamp), rate: Math.max(0, v) / 100 * 12 };
    }).sort((a, b) => a.t - b.t);
    weather.at.radar = Date.now();
  } catch (e) {}
  renderWeather();
}
async function loadAlerts() {
  try { const d = await getJSON(BS + "/alerts?" + qs()); weather.alerts = d.alerts || []; weather.at.alerts = Date.now(); } catch (e) {}
  renderWeather();
}

/* Regen über 12 Std.: Radar (5-Min.-Raster, ca. 2 Std.) wo verfügbar, danach DWD-Vorhersage (MOSMIX, stündlich) */
function rain12(radar, hourly, now) {
  const H = 3600000, THR = 0.1;
  const rad = (radar || []).filter((r) => r.t.getTime() >= now - 5 * 60000);
  const radarEnd = rad.length ? rad[rad.length - 1].t.getTime() + 5 * 60000 : 0;
  const h0 = Math.floor(now / H) * H;
  const buckets = [];
  for (let k = 0; k < 12; k++) {
    const start = Math.max(now, h0 + k * H), end = h0 + (k + 1) * H;
    let b = { start: h0 + k * H, end, mm: null, pp: null, src: null };
    if (rad.length && radarEnd >= end) {
      b.mm = rad.filter((r) => r.t.getTime() >= start - 5 * 60000 && r.t.getTime() < end).reduce((sum, r) => sum + r.rate / 12, 0);
      b.src = "radar";
    } else if (hourly) {
      const f = hourly.find((h) => Math.abs(h.t.getTime() - end) < 60000);
      if (f) { b.mm = typeof f.mm === "number" ? f.mm : 0; b.pp = typeof f.pp === "number" ? f.pp : null; b.src = "fc"; }
    }
    buckets.push(b);
  }
  const wet = (b) => b.mm !== null && b.mm >= THR && (b.src === "radar" || b.pp === null || b.pp >= 40);
  const strength = (mm) => mm < 2.5 ? "Leichter" : mm < 10 ? "Mäßiger" : "Starker";
  const hh = (t) => hm(new Date(t));
  const lastEnd = buckets[buckets.length - 1].end;
  const fcAfterRadar = buckets.filter((b) => b.src === "fc");
  let text;
  const rainingNow = rad.length ? rad[0].rate >= THR : (buckets[0] && wet(buckets[0]));
  if (rad.length && rainingNow) {
    const max = Math.max.apply(null, rad.map((r) => r.rate));
    const stop = rad.find((r) => r.rate < THR);
    if (stop) text = strength(max) + " Regen, hört gegen " + hm(stop.t) + " auf";
    else {
      const dry = fcAfterRadar.find((b) => !wet(b));
      text = strength(max) + " Regen, voraussichtlich " + (dry ? "bis ca. " + hh(dry.start) : "die nächsten 12 Std.");
    }
  } else if (rad.length && rad.some((r) => r.rate >= THR)) {
    const start = rad.find((r) => r.rate >= THR);
    const max = Math.max.apply(null, rad.map((r) => r.rate));
    const inMin = Math.max(0, Math.round((start.t.getTime() - now) / 60000));
    text = strength(max) + " Regen ab ca. " + hm(start.t) + " (in " + inMin + " Min.)";
  } else {
    const pool = rad.length ? fcAfterRadar : buckets.filter((b) => b.src);
    const first = pool.find(wet);
    if (first) {
      const run = [];
      for (let i = pool.indexOf(first); i < pool.length && wet(pool[i]); i++) run.push(pool[i]);
      const max = Math.max.apply(null, run.map((b) => b.mm));
      const pp = Math.max.apply(null, run.map((b) => b.pp || 0));
      const startTxt = first.start <= now ? "jetzt" : "ab ca. " + hh(first.start);
      text = strength(max) + " Regen " + startTxt + (pp ? " (" + pp + " %)" : "");
    } else if (buckets.some((b) => b.src)) text = "Kein Regen bis " + hh(lastEnd) + " erwartet";
    else text = "Keine Regendaten verfügbar.";
  }
  return { text, buckets, radarEnd: rad.length ? radarEnd : 0, lastEnd };
}

function tempChart(hours, now) {
  const pts = hours.filter((h) => h.t.getTime() >= now - 3600000).slice(0, 25);
  if (pts.length < 3) return "";
  const W = 300, H = 112, L = 4, R = 4, T = 20, B = 22;
  const temps = pts.map((p) => p.temp);
  const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
  const pad = Math.max(1, (hi - lo) * 0.15);
  const y0 = lo - pad, y1 = hi + pad;
  const x = (i) => L + (W - L - R) * i / (pts.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  let line = "", area = "";
  pts.forEach((p, i) => { line += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.temp).toFixed(1); });
  area = line + "L" + x(pts.length - 1).toFixed(1) + " " + (H - B) + "L" + x(0).toFixed(1) + " " + (H - B) + "Z";
  let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Temperaturverlauf der nächsten 24 Stunden">';
  svg += '<line class="gr" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>';
  svg += '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>';
  // Stundenmarken alle 6 Std.
  pts.forEach((p, i) => {
    const h = Number(fmtH.format(p.t).replace(/\D/g, ""));
    if (h % 6 === 0 && i > 0 && i < pts.length - 1) {
      svg += '<line class="gr" x1="' + x(i).toFixed(1) + '" x2="' + x(i).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke-dasharray="2 3"/>';
      svg += '<text class="tx" x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + String(h).padStart(2, "0") + " Uhr</text>";
    }
  });
  const iMax = temps.indexOf(hi), iMin = temps.indexOf(lo);
  const anchor = (i) => i < 3 ? "start" : i > pts.length - 4 ? "end" : "middle";
  svg += '<circle class="dt" cx="' + x(iMax).toFixed(1) + '" cy="' + y(hi).toFixed(1) + '" r="2.6"/>';
  svg += '<text class="tv" x="' + x(iMax).toFixed(1) + '" y="' + (y(hi) - 7).toFixed(1) + '" text-anchor="' + anchor(iMax) + '">' + Math.round(hi) + "°</text>";
  if (iMin !== iMax) {
    svg += '<circle class="dt" cx="' + x(iMin).toFixed(1) + '" cy="' + y(lo).toFixed(1) + '" r="2.6"/>';
    svg += '<text class="tv" x="' + x(iMin).toFixed(1) + '" y="' + (y(lo) + 14).toFixed(1) + '" text-anchor="' + anchor(iMin) + '">' + Math.round(lo) + "°</text>";
  }
  svg += "</svg>";
  return svg;
}

function renderWeather() {
  const now = Date.now();
  // Warnungen
  const al = (weather.alerts || []).filter((a) => !a.expires || new Date(a.expires).getTime() > now).slice(0, 2);
  $("alerts").innerHTML = al.map((a) => {
    const sev = a.severity === "severe" || a.severity === "extreme";
    const until = a.expires ? "bis " + fmtWdHM.format(new Date(a.expires)) : "";
    const from = a.onset && new Date(a.onset).getTime() > now ? "ab " + fmtWdHM.format(new Date(a.onset)) + " " : "";
    return '<div class="alert' + (sev ? " severe" : "") + '"><div class="a-k">DWD-Warnung</div><div class="a-t">' + esc(a.event_de || a.headline_de || "Wetterwarnung") +
      '</div><div class="a-w">' + esc(from + until) + "</div></div>";
  }).join("");

  // Aktuell
  const w = weather.now;
  if (w && typeof w.temperature === "number") {
    const extra = [];
    if (typeof w.wind_speed_10 === "number") extra.push("Wind <b>" + Math.round(w.wind_speed_10) + "</b> km/h");
    if (typeof w.relative_humidity === "number") extra.push("Feuchte <b>" + Math.round(w.relative_humidity) + "</b> %");
    let range = "";
    if (weather.hourly && weather.hourly.length) {
      const day = weather.hourly.filter((h) => h.t.getTime() >= now && h.t.getTime() < now + 12 * 3600000).map((h) => h.temp);
      if (day.length) range = "Nächste 12 Std. <b>" + Math.round(Math.min.apply(null, day)) + "°</b> bis <b>" + Math.round(Math.max.apply(null, day)) + "°</b>";
    }
    $("w-now").innerHTML = '<div class="lbl">Jetzt · ' + esc(cfg.place.name) + '</div><div class="now-w" style="margin-top:.45rem">' + icon(w.icon) +
      '<div><div class="temp">' + Math.round(w.temperature) + '°</div></div></div><div class="cond"><b>' + esc(COND[w.icon] || "") + "</b>" +
      (extra.length ? " · " + extra.join(" · ") : "") + (range ? "<br>" + range : "") + "</div>";
  }

  // Regen
  if (weather.radar || weather.hourly) {
    const rs = rain12(weather.radar, weather.hourly, now);
    const bars = '<div class="strip" aria-hidden="true">' + rs.buckets.map((b) => {
      if (b.mm === null || b.mm < 0.1) return '<i class="zero"></i>';
      const h = Math.min(1, Math.sqrt(b.mm / 5));
      const op = b.src === "fc" && b.pp !== null ? (0.3 + 0.7 * b.pp / 100).toFixed(2) : "0.9";
      return '<i style="height:' + Math.max(10, Math.round(h * 100)) + "%;opacity:" + op + '"></i>';
    }).join("") + '</div><div class="strip-ax"><span>jetzt</span><span>' + hm(new Date(rs.buckets[6].start)) + "</span><span>" + hm(new Date(rs.lastEnd)) + "</span></div>" +
      '<div class="strip-src">' + (rs.radarEnd ? "Bis " + hm(new Date(rs.radarEnd)) + " Radar, danach DWD-Vorhersage (blasser = unsicherer)" : "DWD-Vorhersage (blasser = unsicherer)") + "</div>";
    $("w-rain").innerHTML = '<div class="lbl">Regen · nächste 12 Std.</div><div class="rain-s">' + esc(rs.text) + "</div>" + bars;
  }

  // 24 Std.
  if (weather.hourly) {
    $("w-day").innerHTML = '<div class="lbl">Temperatur · 24 Std.</div>' + tempChart(weather.hourly, now);
  }

  const ts = [weather.at.now, weather.at.radar].filter(Boolean);
  const stamp = ts.length ? "Wetter Stand " + hm(new Date(Math.min.apply(null, ts))) + "<br>" : "";
  $("src").innerHTML = stamp + "Fahrplan: VBB via transport.rest · Wetter: Deutscher Wetterdienst via Bright Sky";
}

/* ---------- Uhr & Takt ---------- */
function tickClock() {
  const d = new Date();
  $("hm").textContent = hm(d);
  $("dt").textContent = fmtDay.format(d);
}

const timers = [];
function every(ms, fn) { fn(); timers.push(setInterval(fn, ms)); }
function stopAll() { while (timers.length) clearInterval(timers.pop()); }

let pumping = false;
async function pump() {
  if (pumping || document.hidden) return;
  pumping = true;
  try {
    for (const bs of state.boards) {
      if (Date.now() >= bs.nextAt) { await loadBoard(bs); await new Promise((r) => setTimeout(r, 300)); }
    }
  } finally { pumping = false; }
}

function start() {
  stopAll();
  applyTheme();
  buildBoards();
  every(1000, tickClock);
  every(5000, pump);
  every(15000, () => state.boards.forEach(renderBoard));
  every(60000, () => { applyTheme(); renderWeather(); });
  every(10 * 60000, loadCurrent);
  every(30 * 60000, loadHourly);
  every(5 * 60000, loadRadar);
  every(10 * 60000, loadAlerts);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { state.boards.forEach((b) => { b.nextAt = 0; }); pump(); requestWake(); }
});

/* Bildschirm wach halten (zusätzlich zu „Automatische Sperre: Nie“) */
let wake = null;
async function requestWake() {
  try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
}
requestWake();
document.addEventListener("click", requestWake, { once: true });

/* Täglich um 03:30 neu laden, damit sich nichts aufstaut */
(function scheduleReload() {
  const n = new Date(), t = new Date(n);
  t.setHours(3, 30, 0, 0);
  if (t <= n) t.setDate(t.getDate() + 1);
  setTimeout(() => location.reload(), t - n);
})();

/* ---------- Einstellungen ---------- */
let draft = null;
const sheet = $("sheet");
const emptyBoard = () => ({ title: "Neue Tafel", stop: null, via: null, lines: "", products: ["suburban"], walk: 5, count: 8 });

function refHtml(ref, field, i) {
  if (!ref) return '<div class="cur">' + (field === "via" ? "Beide Richtungen" : "Noch keine Haltestelle gewählt") + "</div>";
  return '<div class="cur"><b>' + esc(ref.name) + "</b> " + (ref.id ? "<em>" + esc(ref.id) + "</em>" : "<em>wird beim Start gesucht</em>") +
    (field === "via" ? ' <button class="btn sm" data-act="clearvia" data-i="' + i + '">Beide Richtungen</button>' : "") + "</div>";
}
function edHtml(b, i, n) {
  const prods = PRODUCTS.map(([p, label]) =>
    '<label><input type="checkbox" id="p-' + i + "-" + p + '" data-i="' + i + '" data-k="prod" data-p="' + p + '"' + (b.products && b.products.indexOf(p) >= 0 ? " checked" : "") + ">" + label + "</label>").join("");
  return '<div class="ed">' +
    '<div class="ed-head"><input type="text" id="t-' + i + '" data-i="' + i + '" data-k="title" value="' + esc(b.title) + '" aria-label="Titel der Tafel">' +
    '<button class="btn sm" data-act="up" data-i="' + i + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Nach oben">↑</button>' +
    '<button class="btn sm" data-act="down" data-i="' + i + '"' + (i === n - 1 ? " disabled" : "") + ' aria-label="Nach unten">↓</button>' +
    '<button class="btn sm danger" data-act="del" data-i="' + i + '">Entfernen</button></div>' +
    '<div class="fld"><span>Haltestelle</span>' + refHtml(b.stop, "stop", i) +
    '<div class="pick"><input type="search" id="sq-stop-' + i + '" placeholder="Haltestelle suchen, z. B. Frankfurter Tor"><button class="btn" data-act="search" data-f="stop" data-i="' + i + '">Suchen</button></div>' +
    '<div class="res" id="sr-stop-' + i + '"></div></div>' +
    '<div class="fld"><span>Richtung über (optional)</span>' + refHtml(b.via, "via", i) +
    '<div class="pick"><input type="search" id="sq-via-' + i + '" placeholder="Nächste Station in Fahrtrichtung"><button class="btn" data-act="search" data-f="via" data-i="' + i + '">Suchen</button></div>' +
    '<div class="res" id="sr-via-' + i + '"></div><small>Zeigt nur Fahrten, die über diese Station fahren. Leer lassen für beide Richtungen.</small></div>' +
    '<div class="grid2">' +
    '<label class="fld"><span>Linien (leer = alle)</span><input type="text" id="l-' + i + '" data-i="' + i + '" data-k="lines" value="' + esc(b.lines) + '" placeholder="S3, S5, S7"></label>' +
    '<label class="fld"><span>Fußweg zur Haltestelle (Min.)</span><input type="number" min="0" max="60" inputmode="numeric" id="w-' + i + '" data-i="' + i + '" data-k="walk" value="' + esc(b.walk) + '"></label>' +
    '<label class="fld"><span>Anzahl Abfahrten</span><input type="number" min="1" max="12" inputmode="numeric" id="c-' + i + '" data-i="' + i + '" data-k="count" value="' + esc(b.count) + '"></label>' +
    "</div>" +
    '<div class="fld"><span>Verkehrsmittel</span><div class="chk">' + prods + "</div></div></div>";
}
function renderSheet(msg) {
  const d = draft;
  const themeOpt = (v, l) => '<label><input type="radio" name="theme" id="th-' + v + '" value="' + v + '"' + (d.theme === v ? " checked" : "") + ">" + l + "</label>";
  sheet.innerHTML = '<div class="sheet-in">' +
    '<div class="sheet-bar"><h1 id="sheet-h">Einstellungen</h1><div class="btns"><button class="btn" data-act="cancel">Abbrechen</button><button class="btn pri" data-act="save">Speichern</button></div></div>' +
    (msg ? '<div class="msg">' + esc(msg) + "</div>" : "") +
    '<section class="sec"><h2>Abfahrtstafeln</h2>' + d.boards.map((b, i) => edHtml(b, i, d.boards.length)).join("") +
    '<div class="btns"><button class="btn" data-act="add">Tafel hinzufügen</button></div></section>' +
    '<section class="sec"><h2>Ort für das Wetter</h2><div class="grid2">' +
    '<label class="fld"><span>Name</span><input type="text" id="pl-name" data-k="place.name" value="' + esc(d.place.name) + '"></label>' +
    '<label class="fld"><span>Breitengrad</span><input type="text" inputmode="decimal" id="pl-lat" data-k="place.lat" value="' + esc(d.place.lat) + '"></label>' +
    '<label class="fld"><span>Längengrad</span><input type="text" inputmode="decimal" id="pl-lon" data-k="place.lon" value="' + esc(d.place.lon) + '"></label></div></section>' +
    '<section class="sec"><h2>Darstellung</h2><div class="radio">' + themeOpt("auto", "Wie iPad") + themeOpt("light", "Hell") + themeOpt("dark", "Dunkel") + "</div>" +
    '<label class="chk"><label><input type="checkbox" id="nightdim" data-k="nightDim"' + (d.nightDim ? " checked" : "") + '>Nachts automatisch dunkel und gedimmt (Sonnenuntergang bis Sonnenaufgang)</label></label></section>' +
    '<section class="sec"><h2>Sichern und übertragen</h2>' +
    '<div class="fld"><span>Aktuelle Einstellungen</span><textarea id="exp" readonly>' + esc(JSON.stringify(cfg, null, 2)) + "</textarea></div>" +
    '<div class="btns"><button class="btn" data-act="copy">Kopieren</button></div>' +
    '<div class="fld"><span>Einstellungen einfügen</span><textarea id="imp" placeholder="Gesicherte Einstellungen hier einfügen"></textarea></div>' +
    '<div class="btns"><button class="btn" data-act="import">Übernehmen</button></div></section>' +
    '<section class="sec"><h2>Erweitert</h2><label class="fld"><span>Adresse der Fahrplan-API</span><input type="text" id="api" data-k="api" value="' + esc(d.api) + '"><small>Nur ändern, wenn du eine eigene vbb-rest-Instanz betreibst.</small></label>' +
    '<div class="btns"><button class="btn danger" data-act="reset">Auf Standard zurücksetzen</button></div></section></div>';
}
function openSheet() { draft = clone(cfg); renderSheet(); sheet.hidden = false; sheet.scrollTop = 0; }
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ""; draft = null; }

sheet.addEventListener("input", (ev) => {
  const t = ev.target, k = t.getAttribute("data-k");
  if (!draft) return;
  if (t.name === "theme") { draft.theme = t.value; return; }
  if (!k) return;
  const i = t.getAttribute("data-i");
  if (i !== null) {
    const b = draft.boards[Number(i)];
    if (k === "prod") {
      const p = t.getAttribute("data-p");
      b.products = (b.products || []).filter((x) => x !== p);
      if (t.checked) b.products.push(p);
      if (b.stop) b.stop.id = b.stop.id; // Haltestelle bleibt
    } else if (k === "walk" || k === "count") b[k] = t.value === "" ? "" : Number(t.value);
    else b[k] = t.value;
  } else if (k === "nightDim") draft.nightDim = t.checked;
  else if (k === "api") draft.api = t.value.trim().replace(/\/+$/, "");
  else if (k.indexOf("place.") === 0) draft.place[k.slice(6)] = t.value;
});
sheet.addEventListener("change", (ev) => { if (ev.target.name === "theme" && draft) draft.theme = ev.target.value; });

sheet.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn || !draft) return;
  const act = btn.getAttribute("data-act"), i = Number(btn.getAttribute("data-i"));
  const B = draft.boards;
  if (act === "cancel") closeSheet();
  else if (act === "save") {
    const lat = parseFloat(String(draft.place.lat).replace(",", ".")), lon = parseFloat(String(draft.place.lon).replace(",", "."));
    if (!(lat > 47 && lat < 56 && lon > 5 && lon < 16)) { renderSheet("Breiten- und Längengrad passen nicht zu Deutschland. Beispiel: 52.5106 und 13.4545."); return; }
    draft.place.lat = lat; draft.place.lon = lon;
    B.forEach((b) => { b.walk = Math.max(0, Math.min(60, Number(b.walk) || 0)); b.count = Math.max(1, Math.min(12, Number(b.count) || 6)); });
    const missing = B.findIndex((b) => !b.stop);
    if (missing >= 0) { renderSheet("Tafel " + (missing + 1) + " hat noch keine Haltestelle."); return; }
    cfg = draft; saveConfig(cfg); closeSheet();
    weather.now = weather.hourly = weather.radar = weather.alerts = null;
    start();
  }
  else if (act === "add") { B.push(emptyBoard()); renderSheet(); }
  else if (act === "up" && i > 0) { [B[i - 1], B[i]] = [B[i], B[i - 1]]; renderSheet(); }
  else if (act === "down" && i < B.length - 1) { [B[i + 1], B[i]] = [B[i], B[i + 1]]; renderSheet(); }
  else if (act === "del") {
    if (btn.classList.contains("armed")) { B.splice(i, 1); renderSheet(); }
    else { btn.classList.add("armed"); btn.textContent = "Wirklich entfernen?"; setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = "Entfernen"; } }, 4000); }
  }
  else if (act === "clearvia") { B[i].via = null; renderSheet(); }
  else if (act === "search") {
    const f = btn.getAttribute("data-f");
    const q = ($("sq-" + f + "-" + i).value || "").trim();
    const out = $("sr-" + f + "-" + i);
    if (q.length < 2) { out.innerHTML = '<span class="cur">Bitte mindestens zwei Zeichen eingeben.</span>'; return; }
    out.innerHTML = '<span class="cur">Suche läuft …</span>';
    try {
      const list = await getJSON(draft.api + "/locations?query=" + encodeURIComponent(q) + "&results=8&poi=false&addresses=false&linesOfStops=false&language=de");
      const stops = (Array.isArray(list) ? list : []).filter((x) => x && (x.type === "stop" || x.type === "station"));
      if (!stops.length) { out.innerHTML = '<span class="cur">Keine Haltestelle gefunden.</span>'; return; }
      out.innerHTML = stops.map((s) => {
        const p = PRODUCTS.filter(([k]) => s.products && s.products[k]).map(([, l]) => l).join(", ");
        return '<button class="btn" data-act="pick" data-f="' + f + '" data-i="' + i + '" data-id="' + esc(s.id) + '" data-name="' + esc(s.name) + '">' + esc(s.name) + '<span class="p">' + esc(p) + "</span></button>";
      }).join("");
    } catch (e) { out.innerHTML = '<span class="cur">Suche fehlgeschlagen. Verbindung prüfen und erneut versuchen.</span>'; }
  }
  else if (act === "pick") {
    const f = btn.getAttribute("data-f");
    B[i][f] = { id: btn.getAttribute("data-id"), name: btn.getAttribute("data-name") };
    renderSheet();
  }
  else if (act === "copy") {
    const ta = $("exp");
    try { await navigator.clipboard.writeText(ta.value); btn.textContent = "Kopiert"; }
    catch (e) { ta.focus(); ta.select(); btn.textContent = "Text markiert, bitte kopieren"; }
  }
  else if (act === "import") {
    try {
      const c = JSON.parse($("imp").value);
      if (!c || !Array.isArray(c.boards)) throw new Error();
      draft = Object.assign(clone(DEFAULTS), c);
      renderSheet("Einstellungen eingelesen. Mit „Speichern“ übernehmen.");
    } catch (e) { renderSheet("Das eingefügte Format ist nicht lesbar. Bitte den kompletten Text aus „Aktuelle Einstellungen“ einfügen."); }
  }
  else if (act === "reset") {
    if (btn.classList.contains("armed")) { draft = clone(DEFAULTS); renderSheet("Standard geladen. Mit „Speichern“ übernehmen."); }
    else { btn.classList.add("armed"); btn.textContent = "Wirklich zurücksetzen?"; }
  }
});
$("gear").addEventListener("click", openSheet);

start();
})();
</script>
