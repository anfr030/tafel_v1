<style>
/* Layout: Abfahrtstafeln links als 2×2-Raster, Wetterspalte rechts mit Routenkarte im freien Raum; im Hochformat Wetter oben. Eine Schrift (Archivo) in drei Breiten. */
:root {
  --bg: #E9EEF0;
  --surface: #FFFFFF;
  --line: #D5DDE1;
  --fg: #111A1F;
  --muted: #5A6A73;
  --faint: #98A6AD;
  --accent: #A96500;
  --late: #BF3B25;
  --warn-bg: #FFF0CF;
  --warn-fg: #5F3B00;
  --severe-bg: #FADCD5;
  --severe-fg: #741A0D;
  --badge-dim: 1;
  --f: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #151D22; --line: #22303A; --fg: #E2E9EC; --muted: #8798A2; --faint: #51616B;
    --accent: #F2B544; --late: #FF7B64; --warn-bg: #362A0F; --warn-fg: #F5D48D; --severe-bg: #3B1611; --severe-fg: #FFB3A4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #151D22; --line: #22303A; --fg: #E2E9EC; --muted: #8798A2; --faint: #51616B;
  --accent: #F2B544; --late: #FF7B64; --warn-bg: #362A0F; --warn-fg: #F5D48D; --severe-bg: #3B1611; --severe-fg: #FFB3A4;
  color-scheme: dark;
}
:root[data-night="1"] {
  --bg: #050708; --surface: #0A0D10; --line: #141B20; --fg: #8F9CA3; --muted: #56636B; --faint: #333D44;
  --accent: #A9792A; --late: #A9574A; --warn-bg: #1E170A; --warn-fg: #A68E5E; --severe-bg: #200C09; --severe-fg: #A97A71;
  --badge-dim: 0.55;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f);
  font-size: clamp(14px, 1.5vmax, 22px); line-height: 1.25;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  overflow: hidden; user-select: none; -webkit-user-select: none;
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(0, 1fr);
  gap: 0.8rem;
  /* Abstand zur Statusleiste: Inhalt beginnt unterhalb der Unschärfezone, die iPadOS unter die Leiste legt */
  padding-block: calc(env(safe-area-inset-top, 0px) + 1rem) calc(env(safe-area-inset-bottom, 0px) + 0.8rem);
  padding-left: max(0.8rem, env(safe-area-inset-left, 0px));
  padding-right: max(0.8rem, env(safe-area-inset-right, 0px));
}
.boards {
  min-width: 0; min-height: 0;
  display: grid; gap: 0.8rem;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
}
.boards[data-n="1"] { grid-template-columns: minmax(0, 1fr); }

/* Tafel */
.board {
  min-width: 0; min-height: 0; overflow: hidden;
  background: var(--surface); border-radius: 14px;
  padding: 0.8rem 0.9rem;
  display: flex; flex-direction: column; gap: 0.45rem;
}
.b-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; }
.b-title { font-weight: 680; font-size: 1.05em; font-stretch: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.b-meta { color: var(--muted); font-size: 0.72em; white-space: nowrap; letter-spacing: 0.02em; }
.b-meta .stale { color: var(--late); font-weight: 600; }
.b-meta .mi { display: inline-flex; align-items: center; gap: 0.2em; margin-left: 0.5em; }
.b-meta .mi svg { width: 1.15em; height: 1.15em; }
.b-note {
  display: flex; gap: 0.4em; align-items: flex-start; cursor: pointer;
  font-size: 0.72em; color: var(--warn-fg); background: var(--warn-bg);
  border-radius: 8px; padding: 0.3em 0.55em;
}
.b-note .tx { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.b-note .more { flex: none; font-weight: 750; padding-left: 0.3em; }
.b-note svg { flex: none; width: 1.1em; height: 1.1em; margin-top: 0.05em; }
.b-pause { font-size: 0.78em; color: var(--muted); padding: 0.1em 0 0.2em; }
.rows { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; min-height: 0; }
.row > .c + .c { padding-left: 0.65em; }
.row { display: contents; }
.row > .c { display: flex; align-items: center; min-width: 0; padding: 0.42em 0; border-top: 1px solid var(--line); }
.row:first-child > .c { border-top: 0; }
.row > .c.r { justify-content: flex-end; }
.badge {
  justify-self: start; min-width: 2.9em; text-align: center;
  font-weight: 760; font-size: 0.86em; letter-spacing: 0.01em;
  color: #fff; border-radius: 6px; padding: 0.16em 0.4em;
  filter: brightness(var(--badge-dim));
}
.badge.tram { border-radius: 2px; }
.badge.s { min-width: 2.5em; font-size: 0.8em; padding: 0.1em 0.35em; border-radius: 5px; }
.badge.s.tram { border-radius: 2px; }
.dest { display: block; font-stretch: 78%; font-weight: 520; font-size: 1.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time { font-weight: 640; font-size: 1.04em; white-space: nowrap; text-align: right; }
.time .dl, .dl { font-size: 0.72em; font-weight: 700; color: var(--late); margin-left: 0.2em; vertical-align: 0.15em; }
.time .dl.ok, .dl.ok { color: var(--muted); font-weight: 500; }
.go { text-align: right; font-size: 0.8em; color: var(--muted); white-space: nowrap; }
.row.next .go { color: var(--accent); font-weight: 720; }
.row.next .dest { font-weight: 640; }
.row.now .go { color: var(--accent); font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; font-size: 0.74em; }
.row.gone > .c { opacity: 0.38; }
.row.plan .time { font-style: italic; font-weight: 500; }
.row.cancel .dest, .row.cancel .time { text-decoration: line-through; }
.row.cancel .go { color: var(--late); font-weight: 650; }
.go.two { flex-direction: column; align-items: flex-end; justify-content: center; gap: 0.15em; font-size: 0.72em; line-height: 1.1; }
.go .m { display: flex; align-items: center; gap: 0.3em; color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
.go .m svg { width: 1.1em; height: 1.1em; flex: none; }
.go .m.off { color: var(--faint); }
.go .m.hot { color: var(--accent); font-weight: 720; }
.go .m.now { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
.row.next .go.two { color: var(--muted); font-weight: 500; }
.empty { grid-column: 1 / -1; color: var(--muted); font-size: 0.85em; padding: 0.6em 0; }

/* Routen */
.routes { display: flex; flex-direction: column; gap: 0.45rem; overflow: hidden; }
.side .routes { flex: 1 1 0; min-height: 7rem; }
.r-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; min-width: 0; }
.r-head .b-meta { display: flex; align-items: center; gap: 0.4em; }
.r-warn {
  display: inline-flex; align-items: center; gap: 0.25em; border: 0; cursor: pointer;
  background: var(--warn-bg); color: var(--warn-fg); border-radius: 999px; padding: 0.15em 0.6em; font-size: 1em; font-weight: 750;
}
.r-warn svg { width: 1.15em; height: 1.15em; }
.side.has-routes .clock .hm { font-size: 2.9em; }
.r-feat { display: flex; flex-direction: column; gap: 0.45rem; flex: none; min-width: 0; }
.r-list {
  flex: 1 1 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; border-top: 1px solid var(--line); font-size: 0.88em; min-width: 0;
}
.r-list.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); }
.r-row {
  flex: none; height: 2.3em; display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr) auto auto; align-items: center; gap: 0.6em;
  border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; padding: 0 0.2em 0 0.55em; font-size: 1em;
}
.r-row:last-child { border-bottom: 0; }
.r-row .rn { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-row .chain { flex-wrap: nowrap; overflow: hidden; font-size: 0.85em; }
.r-row .rg { font-weight: 620; white-space: nowrap; justify-self: end; }
.r-row .ra { color: var(--muted); white-space: nowrap; font-size: 0.92em; }
.r-row.on { box-shadow: inset 3px 0 0 var(--accent); }
.r-row.on .rn, .r-row.on .rg { color: var(--accent); }
.routes { container-type: inline-size; }
@container (max-width: 26em) { .r-row .chain { display: none; } }
.r-sub { font-size: 0.72em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -0.2em; }
.jr { border-top: 1px solid var(--line); padding-top: 0.45em; display: flex; flex-direction: column; gap: 0.35em; min-width: 0; }
.jr.first { border-top: 0; padding-top: 0.1em; }
.j-top { display: flex; align-items: baseline; gap: 0.55em; min-width: 0; }
.j-go { font-weight: 740; color: var(--accent); white-space: nowrap; }
.jr.first .j-go { font-size: 1.12em; }
.j-tm { font-weight: 640; white-space: nowrap; }
.j-du { margin-left: auto; color: var(--muted); font-size: 0.74em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chain { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25em; min-width: 0; font-size: 0.92em; }
.chain .wk { display: inline-flex; align-items: center; gap: 0.05em; color: var(--muted); font-size: 0.78em; font-weight: 600; }
.chain .wk svg { width: 1.15em; height: 1.15em; }
.chain .sep { color: var(--faint); font-size: 0.75em; padding: 0 0.05em; }
.chain .knapp { color: var(--late); font-size: 0.7em; font-weight: 750; }
.legs { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.3em 0.5em; align-items: start; font-size: 0.8em; }
.legs .lg { min-width: 0; display: flex; flex-direction: column; gap: 0.05em; }
.legs .l1, .legs .l2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legs .l1 { font-weight: 640; }
.legs .l2 { color: var(--muted); font-stretch: 85%; }
.legs .x { color: var(--late); font-weight: 700; }
.legs .tr { grid-column: 2; font-size: 0.9em; color: var(--muted); }
.legs .tr.tight { color: var(--late); font-weight: 650; }
.jr.small { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.6em; font-size: 0.9em; }
.jr.small .j-go { font-weight: 650; color: var(--fg); font-size: 0.92em; }
.jr.small .chain { flex-wrap: nowrap; overflow: hidden; font-size: 0.9em; }
.jr.cancel .j-tm { text-decoration: line-through; }
.jr.cancel .j-go { color: var(--late); }
.jr.gone { opacity: 0.4; }

/* Wetterspalte */
.side {
  min-width: 0; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: 0.8rem;
}
.clock { padding: 0.1rem 0.2rem 0; }
.clock .hm { font-size: 3.4em; font-weight: 300; font-stretch: 112%; line-height: 0.95; letter-spacing: -0.02em; }
.clock .dt { color: var(--muted); font-size: 0.86em; margin-top: 0.35em; }
#w-day { display: flex; flex-direction: column; }
#w-day .chart { margin-top: auto; }
.card { background: var(--surface); border-radius: 14px; padding: 0.85rem 0.95rem; min-width: 0; }
.alerts { display: flex; flex-direction: column; gap: 0.5rem; }
.alert { border-radius: 12px; padding: 0.6rem 0.8rem; background: var(--warn-bg); color: var(--warn-fg); }
.alert.severe { background: var(--severe-bg); color: var(--severe-fg); }
.alert .a-k { font-size: 0.66em; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; opacity: 0.85; }
.alert .a-t { font-weight: 700; font-size: 0.95em; margin-top: 0.15em; }
.alert .a-w { font-size: 0.74em; margin-top: 0.15em; }
.now-w { display: flex; align-items: center; gap: 0.7rem; }
.now-w svg { width: 3.2em; height: 3.2em; flex: none; color: var(--fg); }
.temp { font-size: 3.1em; font-weight: 320; font-stretch: 115%; line-height: 1; letter-spacing: -0.02em; }
.cond { color: var(--muted); font-size: 0.8em; margin-top: 0.3em; }
.cond b { color: var(--fg); font-weight: 600; }
.lbl { font-size: 0.64em; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 650; }
.rain-s { font-weight: 620; font-size: 0.98em; margin: 0.35em 0 0.55em; text-wrap: balance; }
.strip { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 2.2em; align-items: end; }
.strip i { display: block; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.9; }
.strip i.zero { background: var(--line); }
.strip-ax { display: flex; justify-content: space-between; font-size: 0.62em; color: var(--muted); margin-top: 0.3em; }
.strip-src { font-size: 0.6em; color: var(--faint); margin-top: 0.25em; }
.chart { width: 100%; height: auto; display: block; margin-top: 0.4em; overflow: visible; }
.chart .ln { fill: none; stroke: var(--fg); stroke-width: 1.6; }
.chart .ar { fill: var(--fg); opacity: 0.07; }
.chart .gr { stroke: var(--line); stroke-width: 1; }
.chart .tx { fill: var(--muted); font-size: 9px; font-family: var(--f); }
.chart .tv { fill: var(--fg); font-size: 10px; font-weight: 650; font-family: var(--f); }
.chart .dt { fill: var(--fg); }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 0.6rem; color: var(--faint); font-size: 0.6em; }
.gear {
  flex: none; border: 0; background: transparent; color: var(--faint);
  width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
}
.gear svg { width: 1.4rem; height: 1.4rem; }
.gear:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Hochformat */
@media (orientation: portrait) {

  .side .foot { grid-column: 1 / -1; margin-top: 0; }
  .clock { display: flex; align-items: baseline; gap: 0.9rem; }
  .clock .hm { font-size: 2.6em; }
}
/* Schmale Bildschirme: eine Spalte, scrollbar */
@media (max-width: 700px) {

  .app { height: auto; }
  .boards { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }

<script>
(function () {

/* ---------- Konfiguration ---------- */
const KEY = "tafel.config.v1";
const TZ = "Europe/Berlin";
const PRODUCTS = [
  ["suburban", "S-Bahn"], ["subway", "U-Bahn"], ["tram", "Tram"], ["bus", "Bus"],
  ["regional", "Regio"], ["express", "Fernverkehr"], ["ferry", "Fähre"]

const ROUTE_PRODUCTS = ["suburban", "subway", "tram", "bus", "regional", "ferry"];
const DEFAULTS = {
  version: 2,
  api: "https://v6.vbb.transport.rest",
  place: { name: "Friedrichshain", lat: 52.5106, lon: 13.4545 },
  home: { place: { kind: "stop", id: null, name: "S+U Warschauer Str." }, walk: 5 },
  theme: "auto",

  ]
};

const clone = (o) => JSON.parse(JSON.stringify(o));
const newId = () => "r" + Math.random().toString(36).slice(2, 9);
function normalizeConfig(c) {
  const out = Object.assign(clone(DEFAULTS), c);
  if (!Array.isArray(out.routes)) out.routes = clone(DEFAULTS.routes);
  if (!out.home || typeof out.home !== "object") out.home = clone(DEFAULTS.home);
  if (!out.home.place) out.home.place = clone(DEFAULTS.home.place);

function loadConfig() {

    if (raw) {

}
function saveConfig(c) {

}
let cfg = loadConfig();
saveConfig(cfg);

/* ---------- Hilfsfunktionen ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtWdHM = new Intl.DateTimeFormat("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ });
const fmtH = new Intl.DateTimeFormat("en-GB", { hour: "numeric", hourCycle: "h23", timeZone: TZ });
const fmtParts = new Intl.DateTimeFormat("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: TZ });

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

async function getJSON(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 12000);

const LINE_COLORS = {
  S1: "#DA6BA2", S2: "#007734", S25: "#007734", S26: "#007734", S3: "#0066AD", S41: "#AD5937", S42: "#CB6418",
  S45: "#CD9C53", S46: "#CD9C53", S47: "#CD9C53", S5: "#EB7405", S7: "#816DA6", S75: "#816DA6", S8: "#66AA22",
  S85: "#66AA22", S9: "#992746", U1: "#7DAD4C", U2: "#DA421E", U3: "#16683D", U4: "#F0D722", U5: "#7E5330",
  U6: "#8C6DAB", U7: "#528DBA", U8: "#224F86", U9: "#F3791D"
};
const PRODUCT_COLORS = { suburban: "#008D4F", subway: "#115D91", tram: "#CC0A22", bus: "#95276E", regional: "#E30613", express: "#5A5A5A", ferry: "#0080BA" };
const TRAM_M = ["M1", "M2", "M4", "M5", "M6", "M8", "M10", "M13", "M17"];
function guessProduct(n) {
  n = normLine(n);
  if (/^S\d/.test(n)) return "suburban";
  if (/^U\d/.test(n)) return "subway";
  if (TRAM_M.indexOf(n) >= 0 || /^\d{2}$/.test(n)) return "tram";
  if (/^(RE|RB)\d/.test(n)) return "regional";
  if (/^F\d/.test(n)) return "ferry";
  return "bus";
}
function badgeStyle(line) {
  const name = (line && line.name || "").replace(/\s+/g, "").toUpperCase();
  const bg = LINE_COLORS[name] || PRODUCT_COLORS[line && line.product] || "#5A6A73";
  const fg = name === "U4" ? "#111" : "#fff";
  return "background:" + bg + ";color:" + fg;
}
function badgeHtml(line, small) {
  const prod = line && line.product === "tram" ? " tram" : "";
  return '<span class="badge' + (small ? " s" : "") + prod + '" style="' + badgeStyle(line) + '">' + esc(line && line.name) + "</span>";
}
function cleanDest(s) {
  return String(s || "")
    .replace(/\s*\(Berlin\)\s*/g, " ").trim()
    .replace(/^S\+U\s+/, "").replace(/^S\s+/, "").replace(/^U\s+/, "")
    .replace(/\s+Bhf\.?$/, "").replace(/\s+/g, " ").trim();
}
function cleanDestFor(dest, line) {
  const l = String(line || "").replace(/[.*+?^${}()|[\]\\]/g, "");
  const out = l ? dest.replace(new RegExp("(^|\\s)" + l + "(?=\\s|$)"), " ").replace(/\s+/g, " ").trim() : dest;
  return out || dest;
}
/* Kurzname für Orte: Haltestellen ohne Präfix, Adressen ohne PLZ/Ort */
function placeShort(ref) {
  if (!ref) return "";
  const n = String(ref.name || "");
  if ((ref.kind || "stop") === "stop") return cleanDest(n);
  const parts = n.split(/\s*,\s*/);
  if (ref.kind === "address" && parts.length > 1) {
    const street = parts.find((p) => /\d/.test(p) && !/^\d{5}\b/.test(p));
    return street || parts[parts.length - 1];
  }
  return n;
}
const normLine = (s) => String(s || "").replace(/\s+/g, "").toUpperCase();
const parseLines = (s) => String(s || "").split(/[,;\s]+/).map(normLine).filter(Boolean);
const minsBetween = (a, b) => Math.round((b.getTime() - a.getTime()) / 60000);

/* Betriebsmeldungen: Kurzfassung + Text, HTML entfernt, nur aktuell gültige */
function plainText(s) {
  const raw = String(s || "");
  if (!/[<&]/.test(raw)) return raw.replace(/\s+/g, " ").trim();
  try {
    const doc = new DOMParser().parseFromString("<body>" + raw.replace(/<br\s*\/?>/gi, " ") + "</body>", "text/html");
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  } catch (e) { return raw.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }
}
function notesOf(list) {
  const now = Date.now();
  return (list || [])
    .filter((r) => r && r.type === "warning")
    .filter((r) => {
      const f = r.validFrom ? Date.parse(r.validFrom) : NaN, u = r.validUntil ? Date.parse(r.validUntil) : NaN;
      return !(f > now) && !(u < now);
    })
    .map((r) => {
      let head = plainText(r.summary).replace(/[\s.:]+$/, ""), body = plainText(r.text);
      if (!head && !body) return null;
      if (!body) { body = head; head = ""; }
      else if (head && body.toLowerCase().indexOf(head.toLowerCase()) === 0) head = "";
      const full = head ? head + ": " + body : body;
      return { head, body, full, prio: Number(r.priority) || 0, key: full.slice(0, 80).toLowerCase() };
    })
    .filter(Boolean);
}
function mergeNotes(groups) {
  const seen = new Set(), out = [];
  groups.forEach((g) => (g || []).forEach((n) => { if (!seen.has(n.key)) { seen.add(n.key); out.push(n); } }));
  return out.sort((a, b) => b.prio - a.prio);
}

/* Sonnenauf-/-untergang (nach SunCalc, V. Agafonkin) */
function sunTimes(date, lat, lng) {
  const rad = Math.PI / 180, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
  const toDays = (d) => d.valueOf() / 86400000 - 0.5 + J1970 - J2000;
  const fromJ = (j) => new Date((j + 0.5 - J1970) * 86400000);
  const lw = rad * -lng, phi = rad * lat, d = toDays(date);
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const h0 = -0.833 * rad;
  const w = Math.acos((Math.sin(h0) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const a = J0 + (w + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}

/* ---------- Darstellung: Theme & Nachtmodus ---------- */
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  const root = document.documentElement;
  const now = new Date();
  const st = sunTimes(now, cfg.place.lat, cfg.place.lon);
  const night = now < new Date(st.rise.getTime() - 20 * 60000) || now > new Date(st.set.getTime() + 30 * 60000);

/* ---------- Orte und Haltestellen auflösen ---------- */
function toRef(x) {
  if (!x) return null;
  const lat = typeof x.latitude === "number" ? x.latitude : x.location && x.location.latitude;
  const lon = typeof x.longitude === "number" ? x.longitude : x.location && x.location.longitude;
  if (x.type === "stop" || x.type === "station") {
    if (!x.id) return null;
    return { kind: "stop", id: String(x.id), name: x.name, lat, lon, info: PRODUCTS.filter(([p]) => x.products && x.products[p]).map(([, l]) => l).join(", ") };
  }
  if (typeof lat !== "number" || typeof lon !== "number") return null;
  if (x.poi) return { kind: "poi", id: x.id ? String(x.id) : null, name: x.name || x.address, lat, lon, info: "Ort" };
  return { kind: "address", id: null, name: x.address || x.name, lat, lon, info: "Adresse" };
}
/* kinds: s = Haltestellen, a = Adressen, p = Orte (POI) */
async function searchLocations(q, kinds, api) {
  const k = kinds || "s";
  const url = (api || cfg.api) + "/locations?query=" + encodeURIComponent(q) + "&results=8&stops=" + (k.indexOf("s") >= 0) +
    "&addresses=" + (k.indexOf("a") >= 0) + "&poi=" + (k.indexOf("p") >= 0) + "&linesOfStops=false&language=de&pretty=false";
  const list = await getJSON(url);
  const want = { stop: "s", address: "a", poi: "p" };
  return (Array.isArray(list) ? list : []).map(toRef).filter((r) => r && k.indexOf(want[r.kind]) >= 0);
}
async function resolveStop(ref, products, api) {
  if (!ref) return null;
  if (ref.id) return ref.id;
  const url = (api || cfg.api) + "/locations?query=" + encodeURIComponent(ref.name) + "&results=8&poi=false&addresses=false&linesOfStops=false&language=de";
  const list = await getJSON(url);
  const arr = Array.isArray(list) ? list : [];
  const stops = arr.filter((x) => x && (x.type === "stop" || x.type === "station") && x.id);
  const want = products && products.length ? products : null;
  const hit = stops.find((s) => !want || want.some((p) => s.products && s.products[p])) || stops[0];
  if (!hit) throw new Error("Haltestelle „" + ref.name + "“ nicht gefunden");
  ref.id = String(hit.id);
  ref.name = hit.name || ref.name;
  const r = toRef(hit);
  if (r && typeof r.lat === "number") { ref.lat = r.lat; ref.lon = r.lon; }
  saveConfig(cfg);
  return ref.id;
}
async function resolvePlace(ref, api) {
  if (!ref) return null;
  const kind = ref.kind || "stop";
  if (kind === "stop" && ref.id) return ref;
  if (kind !== "stop" && typeof ref.lat === "number" && typeof ref.lon === "number") return ref;
  let list = await searchLocations(ref.name, kind === "stop" ? "s" : kind === "address" ? "a" : "p", api);
  if (!list.length) list = await searchLocations(ref.name, "sap", api);
  const hit = list[0];
  if (!hit) throw new Error("„" + ref.name + "“ nicht gefunden");
  ref.kind = hit.kind; ref.id = hit.id; ref.name = hit.name; ref.lat = hit.lat; ref.lon = hit.lon;
  saveConfig(cfg);
  return ref;
}
function placeParams(prefix, p) {
  const kind = p.kind || "stop";
  if (kind === "stop") return prefix + "=" + encodeURIComponent(p.id);
  if (kind === "poi") return prefix + ".id=" + encodeURIComponent(p.id || "") + "&" + prefix + ".name=" + encodeURIComponent(p.name) + "&" + prefix + ".latitude=" + p.lat + "&" + prefix + ".longitude=" + p.lon;
  return prefix + ".address=" + encodeURIComponent(p.name) + "&" + prefix + ".latitude=" + p.lat + "&" + prefix + ".longitude=" + p.lon;
}

/* ---------- Abfahrten ---------- */
const state = { boards: [], routes: [], routeEl: null, routeSel: null, routeSelUntil: 0 };
const WALK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M12 7.5 10.5 14l-3 7M10.5 14l3.5 3 1 4M11.5 9.5 8 12M12 8.5l3.5 3"/></svg>';
const BIKE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9 9h7l2.5 7.5M9 9l3.5 7.5h-7M8 6h3M15 6.5h2.5L16 9"/></svg>';
const NOTE_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.8 18 17H2z"/><path d="M10 8v4M10 14.4v.2" stroke-linecap="round"/></svg>';

function mapDeps(list, want, stopId) {
  return list
    .filter((d) => d && d.line && (!want.length || want.indexOf(normLine(d.line.name)) >= 0))
    .map((d) => ({
      key: d.tripId || [d.line.name, d.plannedWhen || d.when, d.direction].join("|"),
      at: String(d.stop && (d.stop.id || (d.stop.station && d.stop.station.id)) || ""),
      line: d.line,
      dest: cleanDest(d.direction || (d.destination && d.destination.name)),
      t: new Date(d.when || d.plannedWhen),
      planned: d.plannedWhen ? new Date(d.plannedWhen) : null,
      delay: typeof d.delay === "number" ? d.delay : null,
      cancelled: !!d.cancelled,
      notes: notesOf(d.remarks)
    }))
    .filter((d) => !isNaN(d.t))
    .sort((a, b2) => a.t - b2.t)
    // Dieselbe Fahrt kann mehrfach kommen, wenn die API benachbarte Haltepunkte mitliefert.
    // Dann zählt die Abfahrt an der gewählten Haltestelle, sonst die erste.
    .filter((d, i, arr) => {
      const same = arr.filter((x) => x.key === d.key);
      if (same.length === 1) return true;
      const own = same.find((x) => x.at === String(stopId));
      return own ? own === d : same[0] === d;
    });
}

async function fetchDeps(b, stopId, viaId, duration, results, api) {
  let url = (api || cfg.api) + "/stops/" + encodeURIComponent(stopId) + "/departures?duration=" + duration + "&results=" + results + "&remarks=true&language=de&linesOfStops=false&pretty=false";
  const prods = b.products && b.products.length ? b.products : null;
  if (prods) PRODUCTS.forEach(([p]) => { url += "&" + p + "=" + (prods.indexOf(p) >= 0); });
  if (viaId) url += "&direction=" + encodeURIComponent(viaId);
  const data = await getJSON(url);
  const list = Array.isArray(data) ? data : (data && data.departures) || [];
  return mapDeps(list, parseLines(b.lines), stopId);
}

async function loadBoard(bs) {
  const b = bs.cfg;
  try {
    const stopId = await resolveStop(b.stop, b.products);
    const viaId = b.via ? await resolveStop(b.via, null) : null;
    bs.deps = await fetchDeps(b, stopId, viaId, 60, 40);
    bs.depsAt = Date.now();
    bs.notes = mergeNotes(bs.deps.map((d) => d.notes));
    // Weniger Fahrten in der nächsten Stunde als eingestellt (z. B. Nachttakt oder Betriebspause):
    // bis zu 6 Std. vorausschauen, höchstens alle 10 Min.
    const limit = Math.max(1, Number(b.count) || 6);
    const soon = bs.deps.filter((d) => d.t.getTime() > Date.now() - 30000).length;
    if (soon >= limit) bs.ahead = null;
    else if (!bs.ahead || Date.now() - bs.aheadAt > 10 * 60000) {
      try { bs.ahead = await fetchDeps(b, stopId, viaId, 360, 80); bs.aheadAt = Date.now(); } catch (e) {}
    }
    bs.lastOk = Date.now();
    bs.error = null;
    bs.nextAt = Date.now() + 30000;
  } catch (e) {
    bs.error = e;
    bs.nextAt = Date.now() + (e && e.status === 429 ? 90000 : 45000);
  }
  renderBoard(bs);
}

function noteBar(el, notes, src) {
  if (!el) return;
  if (!notes || !notes.length) { el.hidden = true; return; }
  el.hidden = false;
  el.setAttribute("data-src", src);
  el.setAttribute("aria-label", notes.length === 1 ? "Meldung öffnen" : notes.length + " Meldungen öffnen");
  el.innerHTML = NOTE_ICON + '<span class="tx">' + esc(notes[0].full) + "</span>" + (notes.length > 1 ? '<span class="more">+' + (notes.length - 1) + "</span>" : "");
}

function renderBoard(bs) {
  const b = bs.cfg, el = bs.el, now = Date.now();
  el.querySelector(".b-title").textContent = b.title || (b.stop && b.stop.name) || "Tafel";
  const walk = Math.max(0, Number(b.walk) || 0);
  const bike = b.bike === "" || b.bike === null || b.bike === undefined || isNaN(Number(b.bike)) || Number(b.bike) <= 0 ? null : Number(b.bike);
  let meta = bike !== null
    ? '<span class="mi" title="zu Fuß">' + WALK_ICON + walk + '</span><span class="mi" title="mit dem Rad">' + BIKE_ICON + bike + " Min.</span>"
    : (walk ? walk + " Min. Fußweg" : "");
  const stale = bs.lastOk && now - bs.lastOk > 120000;
  if (stale) meta = '<span class="stale">Stand ' + hm(new Date(bs.lastOk)) + "</span>" + (meta ? " · " + meta : "");
  el.querySelector(".b-meta").innerHTML = meta;

  noteBar(el.querySelector(".b-note"), bs.notes, "b" + bs.idx);

  const rows = el.querySelector(".rows");
  const pause = el.querySelector(".b-pause");
  const limit = Math.max(1, Number(b.count) || 6);
  const fresh = bs.deps.filter((d) => d.t.getTime() > now - 30000);
  let deps = fresh.slice(0, limit);
  pause.hidden = true;
  if (deps.length < limit && bs.lastOk && bs.ahead) {
    // Aktuelle Daten zuerst, dahinter Fahrten aus der Vorausschau, die nach dem 60-Min.-Fenster liegen
    const keys = new Set(fresh.map((d) => d.key));
    const windowEnd = (bs.depsAt || now) + 60 * 60000;
    const later = bs.ahead.filter((d) => !keys.has(d.key) && d.t.getTime() > now - 30000 && (d.planned || d.t).getTime() >= windowEnd);
    deps = fresh.concat(later).slice(0, limit);
  }
  if (!fresh.length && bs.lastOk && bs.ahead) {
    const first = deps.find((d) => !d.cancelled);
    pause.hidden = false;
    pause.textContent = first
      ? "Nächste Stunde keine Fahrten · erste um " + hm(first.t)
      : "Keine Fahrten in den nächsten 6 Stunden.";
  }
  if (!deps.length) {
    let msg;
    if (bs.error && !bs.lastOk) msg = bs.error.message && bs.error.message.indexOf("nicht gefunden") >= 0
      ? esc(bs.error.message) + ". Bitte in den Einstellungen prüfen."
      : "Keine Verbindung zur Fahrplanauskunft. Neuer Versuch läuft automatisch.";
    else if (!bs.lastOk) msg = "Abfahrten werden geladen …";
    else if (!pause.hidden) { rows.innerHTML = ""; return; }
    else msg = "Keine Abfahrten in den nächsten 60 Minuten.";
    rows.innerHTML = '<div class="empty">' + msg + "</div>";
    return;
  }
  let nextMarked = false;
  const hot = { walk: false, bike: false };
  const goText = (leave, d, m) => leave < 0 ? "zu knapp" : leave === 0 ? "jetzt los" : leave < 60 ? "los in " + leave + " Min" : "los um " + hm(new Date(d.t.getTime() - m * 60000));
  rows.innerHTML = deps.map((d) => {
    const mins = Math.floor((d.t.getTime() - now) / 60000);
    const leave = mins - walk;
    const cls = ["row"];
    let go, goCls = "";
    if (d.cancelled) { cls.push("cancel"); go = "fällt aus"; }
    else if (bike !== null) {
      // Zwei Optionen: zu Fuß und mit dem Rad, jeweils mit eigener Hervorhebung der ersten erreichbaren Fahrt
      const opts = [["walk", walk, WALK_ICON, "zu Fuß"], ["bike", bike, BIKE_ICON, "mit dem Rad"]].map(([k, m, ic, label]) => {
        const lv = mins - m;
        const mc = ["m"];
        if (lv < 0) mc.push("off");
        else if (lv === 0) mc.push("now");
        if (lv >= 0 && !hot[k]) { mc.push("hot"); hot[k] = true; }
        return { ok: lv >= 0, html: '<span class="' + mc.join(" ") + '" aria-label="' + label + '">' + ic + goText(lv, d, m) + "</span>" };
      });
      if (!opts.some((o) => o.ok)) { cls.push("gone"); go = "zu knapp"; }
      else {
        if (!nextMarked) { cls.push("next"); nextMarked = true; }
        go = opts.map((o) => o.html).join("");
        goCls = " two";
      }
    }
    else if (leave < 0) { cls.push("gone"); go = "zu knapp"; }
    else {
      if (!nextMarked) { cls.push("next"); nextMarked = true; }
      if (leave === 0) { cls.push("now"); go = "jetzt los"; }
      else if (leave < 60) go = "los in " + leave + " Min";
      else go = "los um " + hm(new Date(d.t.getTime() - walk * 60000));
    }
    if (d.delay === null && !d.cancelled) cls.push("plan");
    const t = d.cancelled && d.planned ? d.planned : d.t;
    let dl = "";
    if (d.delay !== null && !d.cancelled) {
      const m = Math.round(d.delay / 60);
      if (m >= 1) dl = '<span class="dl">+' + m + "</span>";
      else if (m <= -1) dl = '<span class="dl ok">' + m + "</span>";
    }
    return '<div class="' + cls.join(" ") + '">' +
      '<span class="c">' + badgeHtml(d.line) + "</span>" +
      '<span class="c"><span class="dest">' + esc(cleanDestFor(d.dest, d.line.name)) + "</span></span>" +
      '<span class="c r time">' + hm(t) + dl + "</span>" +
      '<span class="c r go' + goCls + '">' + go + "</span></div>";
  }).join("");
  while (el.scrollHeight > el.clientHeight + 1 && rows.children.length > 2) rows.removeChild(rows.lastElementChild);
}

/* ---------- Routen ---------- */
function originWalk(r, home, from) {
  if ((from.kind || "stop") !== "stop") return 0;
  return Math.max(0, Number(r.from ? r.walk : home && home.walk) || 0);
}
function mapJourney(j, walk) {
  const legs = (j.legs || []).map((l) => {
    const dep = l.departure || l.plannedDeparture, arr = l.arrival || l.plannedArrival;
    return {
      walk: !!l.walking,
      line: l.line || null,
      dir: cleanDest(l.direction || ""),
      from: cleanDest(l.origin && (l.origin.name || l.origin.address)),
      to: cleanDest(l.destination && (l.destination.name || l.destination.address)),
      dep: dep ? new Date(dep) : null,
      arr: arr ? new Date(arr) : null,
      pdep: l.plannedDeparture ? new Date(l.plannedDeparture) : null,
      ddel: typeof l.departureDelay === "number" ? l.departureDelay : null,
      plat: l.departurePlatform || l.plannedDeparturePlatform || "",
      cancelled: !!l.cancelled,
      notes: notesOf(l.remarks)
    };
  }).filter((l) => l.dep && l.arr && !isNaN(l.dep) && !isNaN(l.arr));
  if (!legs.length) return null;
  const ride = legs.filter((l) => !l.walk);
  const last = legs[legs.length - 1];
  return {
    key: ride.length ? ride.map((l) => (l.line && l.line.name) + "@" + (l.pdep || l.dep).getTime()).join("|") : "walk@" + legs[0].dep.getTime(),
    legs, ride,
    leave: new Date(legs[0].dep.getTime() - walk * 60000),
    arrive: last.arr,
    cancelled: ride.some((l) => l.cancelled),
    notes: mergeNotes(ride.map((l) => l.notes).concat([notesOf(j.remarks)]))
  };
}
async function fetchJourneys(r, home, api, results) {
  const fromRef = r.from || (home && home.place);
  if (!fromRef) throw new Error("Kein Start festgelegt (Einstellungen → Orte)");
  if (!r.to) throw new Error("Kein Ziel festgelegt");
  const from = await resolvePlace(fromRef, api);
  const to = await resolvePlace(r.to, api);
  const walk = originWalk(r, home, from);
  const prods = r.products && r.products.length ? r.products : null;
  let url = (api || cfg.api) + "/journeys?" + placeParams("from", from) + "&" + placeParams("to", to) +
    "&departure=" + encodeURIComponent(new Date(Date.now() + walk * 60000).toISOString()) +
    "&results=" + results + "&stopovers=false&remarks=true&language=de&pretty=false";
  if (prods) PRODUCTS.forEach(([p]) => { url += "&" + p + "=" + (prods.indexOf(p) >= 0); });
  const d = await getJSON(url, 20000);
  const seen = new Set();
  return ((d && d.journeys) || [])
    .map((j) => mapJourney(j, walk))
    .filter((j) => j && !seen.has(j.key) && seen.add(j.key))
    .sort((a, b) => a.leave - b.leave);
}

function buildRoutes() {
  state.routes = (cfg.routes || []).map((r) => ({ cfg: r, journeys: [], lastOk: 0, error: null, notes: [], nextAt: 0 }));
  const side = $("routes");
  side.hidden = true; side.innerHTML = "";
  $("side").classList.remove("has-routes");
  state.routeEl = null;
  if (!state.routes.length || cfg.routePos === "off") return;
  let el = side;
  if (cfg.routePos === "board") {
    el = document.createElement("article");
    el.className = "board routes";
    $("boards").appendChild(el);
  } else side.hidden = false;
  el.innerHTML = '<div class="r-feat"></div><div class="r-list" hidden></div>';
  const list = el.querySelector(".r-list");
  // Solange der Finger auf der Liste liegt oder gescrollt wird, nicht neu zeichnen
  const busy = () => { state.listBusy = true; clearTimeout(state.listBusyT); state.listBusyT = setTimeout(() => { state.listBusy = false; }, 2500); };
  ["pointerdown", "touchstart", "scroll", "wheel"].forEach((t) => list.addEventListener(t, busy, { passive: true }));
  list.addEventListener("scroll", () => fadeHint(list), { passive: true });
  state.routeEl = el;
  $("side").classList.toggle("has-routes", el === side);
  renderRoutes();
}

/* Zeitfenster: Route automatisch zeigen, wenn Wochentag und Uhrzeit passen */
const WD = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
function localNow() {
  const p = {};
  fmtParts.formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return { wd: WD[p.weekday], min: Number(p.hour) * 60 + Number(p.minute) };
}
const toMin = (s) => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ""); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
function routeWindow(r, ln) {
  const days = r.days || [], a = toMin(r.start), b = toMin(r.end);
  if (!days.length && a === null && b === null) return null;
  if (days.length && days.indexOf(ln.wd) < 0) return false;
  if (a === null && b === null) return true;
  const s = a === null ? 0 : a, e = b === null ? 1440 : b;
  return s <= e ? ln.min >= s && ln.min < e : ln.min >= s || ln.min < e;
}
/* Antipp-Statistik: wann welche Route gewählt wurde (nur auf diesem iPad) */
const UKEY = "tafel.usage.v1";
function loadUsage() { try { return JSON.parse(localStorage.getItem(UKEY)) || {}; } catch (e) { return {}; } }
function recordUse(id) {
  if (!id) return;
  const u = loadUsage(), ln = localNow(), now = Date.now();
  u[id] = (u[id] || []).filter((x) => now - x[0] < 60 * 864e5).concat([[now, ln.wd, ln.min]]).slice(-200);
  try { localStorage.setItem(UKEY, JSON.stringify(u)); } catch (e) {}
}
/* Gewichtete Klicks: ältere zählen weniger (Halbwertszeit ca. 2 Wochen). „Slot“ = gleiche Tagesart (Mo–Fr bzw. Sa/So) und ±90 Min. um die aktuelle Uhrzeit */
function usageScores(ln) {
  const u = loadUsage(), now = Date.now();
  return state.routes.map((rs) => {
    let slot = 0, all = 0;
    (u[rs.cfg.id] || []).forEach(([t, wd, m]) => {
      const w = Math.exp(-(now - t) / (21 * 864e5));
      all += w;
      let d = Math.abs(m - ln.min); d = Math.min(d, 1440 - d);
      if ((wd >= 6) === (ln.wd >= 6) && d <= 90) slot += w;
    });
    return { slot, all };
  });
}
function currentRoute() {
  const R = state.routes;
  if (!R.length) return -1;
  if (state.routeSel !== null && Date.now() < state.routeSelUntil) return Math.min(state.routeSel, R.length - 1);
  state.routeSel = null;
  const ln = localNow();
  const hit = R.findIndex((rs) => routeWindow(rs.cfg, ln) === true);
  if (hit >= 0) return hit;
  if (R.length > 1) {
    const sc = usageScores(ln);
    const best = (key, min) => { let k = -1, v = min; sc.forEach((x, i) => { if (x[key] >= v) { v = x[key]; k = i; } }); return k; };
    const bySlot = best("slot", 2);
    if (bySlot >= 0) return bySlot;
    const byAll = best("all", 3);
    if (byAll >= 0) return byAll;
  }
  const free = R.findIndex((rs) => routeWindow(rs.cfg, ln) === null);
  return free >= 0 ? free : 0;
}

/* Hervorgehobene Route jede Minute, die übrigen alle 3 Minuten */
async function loadRoute(rs, featured) {
  const r = rs.cfg;
  const want = clamp(Number(r.results) || 3, 1, 4);
  try {
    rs.journeys = await fetchJourneys(r, cfg.home, cfg.api, featured ? want + 2 : 3);
    rs.lastOk = Date.now();
    rs.error = null;
    rs.nextAt = Date.now() + (featured ? 60000 : 180000);
  } catch (e) {
    rs.error = e;
    rs.nextAt = Date.now() + (e && e.status === 429 ? 120000 : featured ? 60000 : 180000);
  }
  renderRoutes();
}

function goTxt(J, now) {
  if (J.cancelled) return "fällt aus";
  const m = Math.floor((J.leave.getTime() - now) / 60000);
  return m <= 0 ? "jetzt los" : m < 60 ? "los in " + m + " Min" : "los um " + hm(J.leave);
}
function durTxt(J) {
  const m = minsBetween(J.leave, J.arrive);
  const d = m >= 60 ? Math.floor(m / 60) + " Std. " + (m % 60) + " Min" : m + " Min";
  return J.ride.length ? d : d + " zu Fuß";
}
/* Kette: Fußweg, Linien in Reihenfolge; knappe Umstiege markiert */
function chainHtml(J, small) {
  const parts = [];
  let prev = null, walkBetween = 0;
  J.legs.forEach((l, i) => {
    if (l.walk) {
      const m = minsBetween(l.dep, l.arr);
      if (prev) walkBetween += m;
      if (m >= 1 && !small) parts.push('<span class="wk">' + WALK_ICON + m + "</span>");
      else if (m >= 1 && small && (i === 0 || i === J.legs.length - 1)) parts.push('<span class="wk">' + WALK_ICON + m + "</span>");
      return;
    }
    let pre = "";
    if (prev && minsBetween(prev.arr, l.dep) - walkBetween < 2) pre = '<span class="knapp">knapp</span>';
    parts.push(pre + badgeHtml(l.line, true));
    prev = l; walkBetween = 0;
  });
  return parts.join('<span class="sep">›</span>');
}
function legsHtml(J) {
  let h = "", prev = null, walkBetween = 0;
  J.legs.forEach((l) => {
    if (l.walk) { if (prev) walkBetween += minsBetween(l.dep, l.arr); return; }
    if (prev) {
      const gap = minsBetween(prev.arr, l.dep);
      const tight = gap - walkBetween < 2;
      h += '<span class="tr' + (tight ? " tight" : "") + '">Umstieg ' + gap + " Min" + (walkBetween ? ", davon " + walkBetween + " Min Fußweg" : "") + (tight ? " · knapp" : "") + "</span>";
    }
    let dl = "";
    if (l.ddel !== null) { const m = Math.round(l.ddel / 60); if (m >= 1) dl = '<span class="dl">+' + m + "</span>"; }
    h += "<span>" + badgeHtml(l.line, true) + "</span>" +
      '<span class="lg"><span class="l1">' + (l.cancelled ? '<span class="x">fällt aus · </span>' : "") + "Ri. " + esc(l.dir || l.to) + (l.plat ? " · Gl. " + esc(l.plat) : "") + "</span>" +
      '<span class="l2">' + hm(l.dep) + dl + " " + esc(l.from) + " – " + hm(l.arr) + " " + esc(l.to) + "</span></span>";
    prev = l; walkBetween = 0;
  });
  return h;
}
function journeyHtml(J, now, detail) {
  if (!detail) {
    return '<div class="jr small' + (J.cancelled ? " cancel" : "") + '"><span class="j-go">' + goTxt(J, now) + '</span><span class="chain">' + chainHtml(J, true) +
      '</span><span class="j-tm">an ' + hm(J.arrive) + "</span></div>";
  }
  return '<div class="jr first' + (J.cancelled ? " cancel" : "") + '"><div class="j-top"><span class="j-go">' + goTxt(J, now) + '</span><span class="j-tm">an ' + hm(J.arrive) +
    '</span><span class="j-du">' + durTxt(J) + '</span></div><div class="chain">' + chainHtml(J, false) + "</div>" +
    (detail === "legs" && J.ride.length ? '<div class="legs">' + legsHtml(J) + "</div>" : "") + "</div>";
}
function routeHeadHtml(rs, now) {
  const stale = rs.lastOk && now - rs.lastOk > 240000;
  return '<div class="r-head"><div class="b-title">' + esc(rs.cfg.title || "Route") + '</div><div class="b-meta">' +
    (stale ? '<span class="stale">Stand ' + hm(new Date(rs.lastOk)) + "</span>" : "") + "</div></div>";
}
function fadeHint(list) {
  list.classList.toggle("more", list.scrollHeight > list.clientHeight + 2 && list.scrollTop + list.clientHeight < list.scrollHeight - 2);
}
function renderRoutes() {
  const el = state.routeEl;
  if (!el) return;
  const idx = currentRoute();
  if (idx < 0) return;
  const feat = el.querySelector(".r-feat"), list = el.querySelector(".r-list");
  if (!feat || !list) return;
  renderRouteList(el, list, idx);
  renderFeatured(el, feat, idx);
  fadeHint(list);
}
/* Scrollbare Liste aller Routen mit jeweils der nächsten Verbindung */
function renderRouteList(el, list, idx) {
  const R = state.routes, now = Date.now();
  el.classList.toggle("has-list", R.length > 1);
  if (R.length < 2) { list.hidden = true; list.innerHTML = ""; return; }
  list.hidden = false;
  list.style.minHeight = (Math.min(R.length, 2.5) * 2.3) + "em";
  if (state.listBusy && list.childElementCount === R.length) {
    list.querySelectorAll(".r-row").forEach((b, k) => b.classList.toggle("on", k === idx));
    return;
  }
  const top = list.scrollTop;
  list.innerHTML = R.map((rs, k) => {
    const live = rs.journeys.filter((j) => j.leave.getTime() >= now - 30000);
    const J = live.find((j) => !j.cancelled) || live[0];
    if (!J && rs.lastOk && now - rs.lastOk > 20000) rs.nextAt = Math.min(rs.nextAt, now);
    const go = J ? goTxt(J, now) : rs.error && !rs.lastOk ? "keine Daten" : rs.lastOk ? "keine Verbindung" : "lädt …";
    return '<button class="r-row' + (k === idx ? " on" : "") + '" data-route="' + k + '"><span class="rn">' + esc(rs.cfg.title || "Route") + '</span><span class="chain">' +
      (J ? chainHtml(J, true) : "") + '</span><span class="rg">' + go + '</span><span class="ra">' + (J ? "an " + hm(J.arrive) : "") + "</span></button>";
  }).join("");
  list.scrollTop = top;
}
/* Hervorgehobene Route: vom ausführlichsten zum knappsten Aufbau, bis die Karte samt Liste passt */
function renderFeatured(el, feat, idx) {
  const rs = state.routes[idx], r = rs.cfg, now = Date.now();
  const want = clamp(Number(r.results) || 3, 1, 4);
  const live = rs.journeys.filter((j) => j.leave.getTime() >= now - 30000);
  if (rs.lastOk && (now - rs.lastOk > 70000 || (live.length < want && now - rs.lastOk > 20000))) rs.nextAt = Math.min(rs.nextAt, now);
  const head = routeHeadHtml(rs, now);
  const sub = '<div class="r-sub">' + esc(r.from ? placeShort(r.from) : "Zuhause") + " → " + esc(placeShort(r.to) || "kein Ziel") + "</div>";
  if (!live.length) {
    let msg;
    if (rs.error && !rs.lastOk) msg = rs.error.message && /nicht gefunden|festgelegt/.test(rs.error.message) ? esc(rs.error.message) + "." : "Keine Verbindung zur Fahrplanauskunft. Neuer Versuch läuft automatisch.";
    else if (!rs.lastOk) msg = "Verbindungen werden geladen …";
    else msg = "Keine Verbindung gefunden.";
    feat.innerHTML = head + sub + '<div class="empty">' + msg + "</div>";
    return;
  }
  const notes = mergeNotes(live.slice(0, want).map((j) => j.notes));
  const first = live.findIndex((j) => !j.cancelled);
  const warnBtn = notes.length ? '<button class="r-warn" data-src="r" aria-label="' + notes.length + (notes.length === 1 ? " Meldung" : " Meldungen") + ' öffnen">' + NOTE_ICON + notes.length + "</button>" : "";
  const build = (n, detail, bar, withSub) => {
    const js = live.slice(0, n);
    const di = first >= 0 && first < n ? first : -1;
    return (bar ? head : head.replace('<div class="b-meta">', '<div class="b-meta">' + warnBtn)) + (withSub ? sub : "") +
      (bar ? '<div class="b-note" role="button" tabindex="0" hidden></div>' : "") +
      js.map((J, k) => journeyHtml(J, now, k === di ? detail : false)).join("");
  };
  const variants = [];
  for (let n = want; n >= 1; n--) variants.push([n, "legs", true, true]);
  for (let n = want; n >= 1; n--) variants.push([n, "legs", false, false]);
  for (let n = want; n >= 1; n--) variants.push([n, "chain", false, false]);
  for (let n = want; n >= 1; n--) variants.push([n, false, false, false]);
  for (const [n, d, bar, s] of variants) {
    feat.innerHTML = build(Math.min(n, live.length), d, bar, s);
    if (bar) noteBar(feat.querySelector(".b-note"), notes, "r");
    if (el.scrollHeight <= el.clientHeight + 1) break;
  }
}

    case "partly-cloudy-night": body = '<g transform="translate(-4 -6) scale(.75)">' + moon(22, 24, 10) + "</g>" + '<g transform="translate(4 4) scale(.9)">' + cloud + "</g>"; break;
    case "rain": body = '<g transform="translate(0 -5)">' + cloud + '</g><path d="M17 37l-2 5M25 37l-2 5M33 37l-2 5"/>'; break;
    case "sleet": body = '<g transform="translate(0 -5)">' + cloud + '</g><path d="M17 37l-2 5M31 37l-2 5"/><circle cx="24" cy="40" r=".9"/>'; break;

/* Regen über 12 Std.: Radar (5-Min.-Raster, ca. 2 Std.) wo verfügbar, danach DWD-Vorhersage (MOSMIX, stündlich) */
function rain12(radar, hourly, now) {
  const H = 3600000, THR = 0.1;
  const rad = (radar || []).filter((r) => r.t.getTime() >= now - 5 * 60000);
  const radarEnd = rad.length ? rad[rad.length - 1].t.getTime() + 5 * 60000 : 0;
  const h0 = Math.floor(now / H) * H;
  const buckets = [];
  for (let k = 0; k < 12; k++) {
    const start = Math.max(now, h0 + k * H), end = h0 + (k + 1) * H;
    let b = { start: h0 + k * H, end, mm: null, pp: null, src: null };
    if (rad.length && radarEnd >= end) {
      b.mm = rad.filter((r) => r.t.getTime() >= start - 5 * 60000 && r.t.getTime() < end).reduce((sum, r) => sum + r.rate / 12, 0);
      b.src = "radar";
    } else if (hourly) {
      const f = hourly.find((h) => Math.abs(h.t.getTime() - end) < 60000);
      if (f) { b.mm = typeof f.mm === "number" ? f.mm : 0; b.pp = typeof f.pp === "number" ? f.pp : null; b.src = "fc"; }
    }
    buckets.push(b);
  }
  const wet = (b) => b.mm !== null && b.mm >= THR && (b.src === "radar" || b.pp === null || b.pp >= 40);
  const strength = (mm) => mm < 2.5 ? "Leichter" : mm < 10 ? "Mäßiger" : "Starker";
  const hh = (t) => hm(new Date(t));
  const lastEnd = buckets[buckets.length - 1].end;
  const fcAfterRadar = buckets.filter((b) => b.src === "fc");
  let text;
  const rainingNow = rad.length ? rad[0].rate >= THR : (buckets[0] && wet(buckets[0]));
  if (rad.length && rainingNow) {
    const max = Math.max.apply(null, rad.map((r) => r.rate));
    const stop = rad.find((r) => r.rate < THR);
    if (stop) text = strength(max) + " Regen, hört gegen " + hm(stop.t) + " auf";
    else {
      const dry = fcAfterRadar.find((b) => !wet(b));
      text = strength(max) + " Regen, voraussichtlich " + (dry ? "bis ca. " + hh(dry.start) : "die nächsten 12 Std.");
    }
  } else if (rad.length && rad.some((r) => r.rate >= THR)) {
    const start = rad.find((r) => r.rate >= THR);
    const max = Math.max.apply(null, rad.map((r) => r.rate));
    const inMin = Math.max(0, Math.round((start.t.getTime() - now) / 60000));
    text = strength(max) + " Regen ab ca. " + hm(start.t) + " (in " + inMin + " Min.)";
  } else {
    const pool = rad.length ? fcAfterRadar : buckets.filter((b) => b.src);
    const first = pool.find(wet);
    if (first) {
      const run = [];
      for (let i = pool.indexOf(first); i < pool.length && wet(pool[i]); i++) run.push(pool[i]);
      const max = Math.max.apply(null, run.map((b) => b.mm));
      const pp = Math.max.apply(null, run.map((b) => b.pp || 0));
      const startTxt = first.start <= now ? "jetzt" : "ab ca. " + hh(first.start);
      text = strength(max) + " Regen " + startTxt + (pp ? " (" + pp + " %)" : "");
    } else if (buckets.some((b) => b.src)) text = "Kein Regen bis " + hh(lastEnd) + " erwartet";
    else text = "Keine Regendaten verfügbar.";
  }
  return { text, buckets, radarEnd: rad.length ? radarEnd : 0, lastEnd };
}

function tempChart(hours, now, compact) {
  const pts = hours.filter((h) => h.t.getTime() >= now - 3600000).slice(0, 25);
  if (pts.length < 3) return "";
  const W = 300, H = compact ? 84 : 112, L = 4, R = 4, T = compact ? 16 : 20, B = compact ? 20 : 22;
  const temps = pts.map((p) => p.temp);
  const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps);
  const pad = Math.max(1, (hi - lo) * 0.15);
  const y0 = lo - pad, y1 = hi + pad;
  const x = (i) => L + (W - L - R) * i / (pts.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  let line = "", area = "";
  pts.forEach((p, i) => { line += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.temp).toFixed(1); });
  area = line + "L" + x(pts.length - 1).toFixed(1) + " " + (H - B) + "L" + x(0).toFixed(1) + " " + (H - B) + "Z";
  let svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Temperaturverlauf der nächsten 24 Stunden">';
  svg += '<line class="gr" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>';
  svg += '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>';
  // Stundenmarken alle 6 Std.
  pts.forEach((p, i) => {
    const h = Number(fmtH.format(p.t).replace(/\D/g, ""));
    if (h % 6 === 0 && i > 0 && i < pts.length - 1) {
      svg += '<line class="gr" x1="' + x(i).toFixed(1) + '" x2="' + x(i).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke-dasharray="2 3"/>';
      svg += '<text class="tx" x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + String(h).padStart(2, "0") + " Uhr</text>";
    }
  });
  const iMax = temps.indexOf(hi), iMin = temps.indexOf(lo);
  const anchor = (i) => i < 3 ? "start" : i > pts.length - 4 ? "end" : "middle";
  svg += '<circle class="dt" cx="' + x(iMax).toFixed(1) + '" cy="' + y(hi).toFixed(1) + '" r="2.6"/>';
  svg += '<text class="tv" x="' + x(iMax).toFixed(1) + '" y="' + (y(hi) - 7).toFixed(1) + '" text-anchor="' + anchor(iMax) + '">' + Math.round(hi) + "°</text>";
  if (iMin !== iMax) {
    svg += '<circle class="dt" cx="' + x(iMin).toFixed(1) + '" cy="' + y(lo).toFixed(1) + '" r="2.6"/>';
    // Kompakt: Tiefstwert neben den Punkt setzen, sonst kollidiert er mit der Zeitachse
    const right = iMin > pts.length * 0.7;
    svg += compact
      ? '<text class="tv" x="' + (x(iMin) + (right ? -6 : 6)).toFixed(1) + '" y="' + (y(lo) + 3.5).toFixed(1) + '" text-anchor="' + (right ? "end" : "start") + '">' + Math.round(lo) + "°</text>"
      : '<text class="tv" x="' + x(iMin).toFixed(1) + '" y="' + (y(lo) + 14).toFixed(1) + '" text-anchor="' + anchor(iMin) + '">' + Math.round(lo) + "°</text>";
  }
  svg += "</svg>";
  return svg;
}

function renderWeather() {
  const now = Date.now();
  // Warnungen
  const al = (weather.alerts || []).filter((a) => !a.expires || new Date(a.expires).getTime() > now).slice(0, 2);
  $("alerts").innerHTML = al.map((a) => {
    const sev = a.severity === "severe" || a.severity === "extreme";
    const until = a.expires ? "bis " + fmtWdHM.format(new Date(a.expires)) : "";
    const from = a.onset && new Date(a.onset).getTime() > now ? "ab " + fmtWdHM.format(new Date(a.onset)) + " " : "";
    return '<div class="alert' + (sev ? " severe" : "") + '"><div class="a-k">DWD-Warnung</div><div class="a-t">' + esc(a.event_de || a.headline_de || "Wetterwarnung") +
      '</div><div class="a-w">' + esc(from + until) + "</div></div>";
  }).join("");

  // Aktuell
  const w = weather.now;
  if (w && typeof w.temperature === "number") {
    const extra = [];
    if (typeof w.wind_speed_10 === "number") extra.push("Wind <b>" + Math.round(w.wind_speed_10) + "</b> km/h");
    if (typeof w.relative_humidity === "number") extra.push("Feuchte <b>" + Math.round(w.relative_humidity) + "</b> %");
    let range = "";
    if (weather.hourly && weather.hourly.length) {
      const day = weather.hourly.filter((h) => h.t.getTime() >= now && h.t.getTime() < now + 12 * 3600000).map((h) => h.temp);
      if (day.length) range = "Nächste 12 Std. <b>" + Math.round(Math.min.apply(null, day)) + "°</b> bis <b>" + Math.round(Math.max.apply(null, day)) + "°</b>";
    }
    $("w-now").innerHTML = '<div class="lbl">Jetzt · ' + esc(cfg.place.name) + '</div><div class="now-w" style="margin-top:.45rem">' + icon(w.icon) +
      '<div><div class="temp">' + Math.round(w.temperature) + '°</div></div></div><div class="cond"><b>' + esc(COND[w.icon] || "") + "</b>" +
      (extra.length ? " · " + extra.join(" · ") : "") + (range ? "<br>" + range : "") + "</div>";
  }

  // Regen
  if (weather.radar || weather.hourly) {
    const rs = rain12(weather.radar, weather.hourly, now);
    const bars = '<div class="strip" aria-hidden="true">' + rs.buckets.map((b) => {
      if (b.mm === null || b.mm < 0.1) return '<i class="zero"></i>';
      const h = Math.min(1, Math.sqrt(b.mm / 5));
      const op = b.src === "fc" && b.pp !== null ? (0.3 + 0.7 * b.pp / 100).toFixed(2) : "0.9";
      return '<i style="height:' + Math.max(10, Math.round(h * 100)) + "%;opacity:" + op + '"></i>';
    }).join("") + '</div><div class="strip-ax"><span>jetzt</span><span>' + hm(new Date(rs.buckets[6].start)) + "</span><span>" + hm(new Date(rs.lastEnd)) + "</span></div>" +
      '<div class="strip-src">' + (rs.radarEnd ? "Bis " + hm(new Date(rs.radarEnd)) + " Radar, danach DWD-Vorhersage (blasser = unsicherer)" : "DWD-Vorhersage (blasser = unsicherer)") + "</div>";
    $("w-rain").innerHTML = '<div class="lbl">Regen · nächste 12 Std.</div><div class="rain-s">' + esc(rs.text) + "</div>" + bars;
  }

  // 24 Std.
  if (weather.hourly) {
    $("w-day").innerHTML = '<div class="lbl">Temperatur · 24 Std.</div>' + tempChart(weather.hourly, now, !!state.routeEl && state.routeEl.id === "routes" && !matchMedia("(orientation: portrait)").matches);
  }

  const ts = [weather.at.now, weather.at.radar].filter(Boolean);
  const stamp = ts.length ? "Wetter Stand " + hm(new Date(Math.min.apply(null, ts))) + "<br>" : "";
  $("src").innerHTML = stamp + "Fahrplan: VBB via transport.rest · Wetter: Deutscher Wetterdienst via Bright Sky";
  // Höhe der Wetterkarten kann sich geändert haben, die Routenkarte passt sich an
  renderRoutes();
}

/* ---------- Uhr & Takt ---------- */
function tickClock() {
  const d = new Date();
  $("hm").textContent = hm(d);
  $("dt").textContent = fmtDay.format(d);
}

const timers = [];
function every(ms, fn) { fn(); timers.push(setInterval(fn, ms)); }
function stopAll() { while (timers.length) clearInterval(timers.pop()); }

let pumping = false;
async function pump() {
  if (pumping || document.hidden) return;
  pumping = true;
  try {
    for (const bs of state.boards) {
      if (Date.now() >= bs.nextAt) { await loadBoard(bs); await new Promise((r) => setTimeout(r, 300)); }
    }
    if (state.routeEl) {
      const fi = currentRoute();
      // Die hervorgehobene Route zuerst, dann die Liste
      const order = state.routes.map((x, k) => k).sort((a, b) => (b === fi) - (a === fi));
      for (const k of order) {
        const rs = state.routes[k];
        if (Date.now() >= rs.nextAt) { await loadRoute(rs, k === fi); await new Promise((r) => setTimeout(r, 300)); }
      }
    }
  } finally { pumping = false; }
}

function start() {
  stopAll();
  applyTheme();
  buildBoards();
  buildRoutes();
  every(1000, tickClock);
  every(5000, pump);
  every(15000, () => { state.boards.forEach(renderBoard); renderRoutes(); });
  every(60000, () => { applyTheme(); renderWeather(); });
  every(10 * 60000, loadCurrent);
  every(30 * 60000, loadHourly);
  every(5 * 60000, loadRadar);
  every(10 * 60000, loadAlerts);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { state.boards.forEach((b) => { b.nextAt = 0; }); state.routes.forEach((r) => { r.nextAt = 0; }); pump(); requestWake(); }
});
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => { state.boards.forEach(renderBoard); renderRoutes(); }, 200); });

let wake = null;
async function requestWake() {
  try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) { wake = null; }
}
requestWake();

function daysTxt(days) {
  const s = (days || []).slice().sort((a, b) => a - b);
  if (!s.length) return "";

  const out = [];
  for (let i = 0; i < s.length; i++) {
    let j = i;
    while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
    out.push(j - i >= 2 ? DAYS[s[i] - 1] + "–" + DAYS[s[j] - 1] : s.slice(i, j + 1).map((d) => DAYS[d - 1]).join(", "));
    i = j;
  }
  return out.join(", ");
}

    '<section class="sec"><h2>Verkehrsmittel</h2>' + prods + "</section>" +
    '<section class="sec"><h2>Automatisch zeigen</h2>' + days +
    '<div class="times"><input type="time" data-k="r.start" value="' + esc(r.start || "") + '" aria-label="von"><span>bis</span><input type="time" data-k="r.end" value="' + esc(r.end || "") + '" aria-label="bis"></div>' +
    '<div class="hint">Zu diesen Zeiten zeigt die Routenkarte diese Route von selbst, z. B. Mo–Fr 7–11 Uhr. Leer lassen, wenn die Route nur per Antippen erscheinen soll.</div></section>' +
    '<section class="sec"><h2>Umfang</h2>' + stepper("Verbindungen anzeigen", "r.results", r.results, 1, 4, "") + "</section>" +
    '<section class="sec"><h2>Vorschau</h2><div id="pv" class="pv-r"><span class="hint">…</span></div></section>' +
    '<div class="dz"><button class="btn danger" data-act="delitem">Route entfernen</button></div>';
}

function renderSheet() {
  let title = "Einstellungen", body, left = "", right;
  if (ui.edit) {
    const it = curItem();
    left = '<button class="btn ghost" data-act="back">‹ ' + (ui.edit.type === "board" ? "Tafeln" : "Routen") + "</button>";
    title = it ? (it.title || (ui.edit.type === "board" ? "Tafel" : "Route")) : "";
    right = '<button class="btn pri" data-act="back">Fertig</button>';
    body = ui.edit.type === "board" ? boardEditor(ui.edit.i) : routeEditor(ui.edit.i);
  } else {
    right = '<button class="btn" data-act="cancel">Abbrechen</button><button class="btn pri" data-act="save">Speichern</button>';
    const tabs = '<div class="tabs" role="tablist">' + TABS.map(([k, l]) => '<button class="tab' + (ui.tab === k ? " on" : "") + '" role="tab" aria-selected="' + (ui.tab === k) + '" data-act="tab" data-tab="' + k + '">' + l + "</button>").join("") + "</div>";
    const fn = { boards: boardsTab, routes: routesTab, places: placesTab, look: lookTab, backup: backupTab }[ui.tab] || boardsTab;
    body = tabs + fn();
  }
  sheet.innerHTML = '<div class="sheet-in"><div class="sheet-bar"><div class="l">' + left + '<h1 id="sheet-h">' + esc(title) + '</h1></div><div class="btns">' + right + "</div></div>" +
    (sheetMsg ? '<div class="msg' + (sheetMsg.ok ? " ok" : "") + '">' + esc(sheetMsg.text) + "</div>" : "") + body + "</div>";
  sheetMsg = null;
  if (ui.edit && ui.edit.type === "board") loadLineChips();
  if (ui.edit) schedulePreview(0);
}
function openSheet() { draft = clone(cfg); ui = { tab: ui.tab || "boards", edit: null }; renderSheet(); sheet.hidden = false; sheet.scrollTop = 0; }
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ""; draft = null; ui.edit = null; }
function go(next) { ui = Object.assign({}, ui, next); renderSheet(); sheet.scrollTop = 0; }

/* Liniensuche an der Haltestelle */
async function loadLineChips() {
  const e = ui.edit;
  if (!e || e.type !== "board") return;
  const b = draft.boards[e.i];
  if (!b.stop) return;
  try {
    const id = await resolveStop(b.stop, b.products, draft.api);
    const st = await getJSON(draft.api + "/stops/" + encodeURIComponent(id) + "?linesOfStops=true&language=de&pretty=false");
    if (!ui.edit || draft.boards[e.i] !== b || !$("lines")) return;
    const order = PRODUCTS.map(([p]) => p), seen = {};
    lineCache = [];
    (st.lines || []).forEach((l) => { const n = normLine(l.name); if (n && !seen[n]) { seen[n] = 1; lineCache.push({ name: l.name, n, product: l.product }); } });
    parseLines(b.lines).forEach((n) => { if (!seen[n]) { seen[n] = 1; lineCache.push({ name: n, n, product: guessProduct(n) }); } });
    lineCache.sort((a, c) => (order.indexOf(a.product) - order.indexOf(c.product)) || a.n.localeCompare(c.n, "de", { numeric: true }));
    renderLineChips(b);
  } catch (err) {
    const host = $("lines");
    if (host) host.innerHTML = '<span class="hint err">Linien konnten nicht geladen werden. Du kannst sie von Hand eintragen:</span>' +
      '<input type="text" data-k="b.lines" value="' + esc(b.lines) + '" placeholder="S3, S5, M10">';
  }
}
function renderLineChips(b) {
  const host = $("lines");
  if (!host) return;
  const sel = parseLines(b.lines);
  host.innerHTML = lineCache.length ? lineCache.map((l) => '<button type="button" class="lchip' + (sel.indexOf(l.n) >= 0 ? " on" : "") + '" data-act="line" data-l="' + esc(l.n) + '" aria-pressed="' + (sel.indexOf(l.n) >= 0) + '">' +
    badgeHtml({ name: l.name, product: l.product }) + "</button>").join("") : '<span class="hint">An dieser Haltestelle wurden keine Linien gefunden.</span>';
}

/* Vorschau im Editor */
function schedulePreview(ms) { clearTimeout(pvTimer); pvTimer = setTimeout(runPreview, ms == null ? 400 : ms); }
async function runPreview() {
  const e = ui.edit, host = $("pv");
  if (!e || !host) return;
  const tok = ++pvTok;
  if (e.type === "board") {
    const b = draft.boards[e.i];
    if (!b.stop) { host.innerHTML = '<span class="hint">Erst eine Haltestelle wählen.</span>'; return; }
    host.innerHTML = '<span class="hint">Abfahrten werden geladen …</span>';
    try {
      const id = await resolveStop(b.stop, b.products, draft.api);
      const via = b.via ? await resolveStop(b.via, null, draft.api) : null;
      const deps = (await fetchDeps(b, id, via, 90, 40, draft.api)).filter((d) => d.t.getTime() > Date.now() - 30000).slice(0, 6);
      if (tok !== pvTok || !$("pv")) return;
      host.innerHTML = deps.length ? deps.map((d) => "<span>" + badgeHtml(d.line) + '</span><span class="dest">' + esc(cleanDestFor(d.dest, d.line.name)) + '</span><span class="time">' + hm(d.cancelled && d.planned ? d.planned : d.t) + "</span>").join("")
        : '<span class="hint">Keine Abfahrten mit diesen Einstellungen in den nächsten 90 Minuten. Prüfe Linien und Richtung.</span>';
    } catch (err) {
      if (tok === pvTok && $("pv")) host.innerHTML = '<span class="hint err">' + esc(err && err.message && err.message.indexOf("nicht gefunden") >= 0 ? err.message : "Vorschau nicht verfügbar, keine Verbindung zur Fahrplanauskunft.") + "</span>";
    }
  } else {
    const r = draft.routes[e.i];
    if (!r.to) { host.innerHTML = '<span class="hint">Erst ein Ziel wählen.</span>'; return; }
    host.innerHTML = '<span class="hint">Verbindungen werden gesucht …</span>';
    try {
      const js = await fetchJourneys(r, draft.home, draft.api, 3);
      if (tok !== pvTok || !$("pv")) return;
      const now = Date.now();
      host.innerHTML = js.length ? js.slice(0, 3).map((J, k) => journeyHtml(J, now, k === 0 ? "legs" : false)).join("") : '<span class="hint">Keine Verbindung gefunden.</span>';
    } catch (err) {
      if (tok === pvTok && $("pv")) host.innerHTML = '<span class="hint err">' + esc(err && err.message && /nicht gefunden|festgelegt/.test(err.message) ? err.message : "Vorschau nicht verfügbar, keine Verbindung zur Fahrplanauskunft.") + "</span>";
    }
  }
}

/* Live-Suche */
async function runSearch(sid, q, kinds) {
  const out = $("sr-" + sid);
  if (!out) return;
  if (q.length < 2) { out.innerHTML = ""; return; }
  const tok = (searchTok[sid] = (searchTok[sid] || 0) + 1);
  out.innerHTML = '<div class="hint">Suche …</div>';
  try {
    const list = await searchLocations(q, kinds, draft.api);
    if (tok !== searchTok[sid] || !$("sr-" + sid)) return;
    searchStore[sid] = list;
    out.innerHTML = list.length ? list.map((x, k) => '<button type="button" class="hit" data-act="pickloc" data-sid="' + sid + '" data-k="' + k + '">' + kindIcon(x.kind) +
      '<span class="h-n">' + esc(x.name) + '</span><span class="h-p">' + esc(x.info || "") + "</span></button>").join("") : '<div class="hint">Nichts gefunden.</div>';
  } catch (e) {
    if (tok === searchTok[sid] && $("sr-" + sid)) out.innerHTML = '<div class="hint err">Suche fehlgeschlagen. Verbindung prüfen und erneut versuchen.</div>';
  }
}
function applyPick(sid, x) {
  const ref = { kind: x.kind, id: x.id, name: x.name, lat: x.lat, lon: x.lon };
  const it = curItem();
  if (sid === "b-stop") {
    if (!it.stop || it.stop.id !== ref.id) { it.lines = ""; it.products = []; }
    it.stop = ref; autoTitle(it);
  } else if (sid === "b-via") { it.via = ref; autoTitle(it); }
  else if (sid === "r-from") { it.from = ref; if (it.walk == null) it.walk = 5; }
  else if (sid === "r-to") { it.to = ref; if (!it.title || it.title === "Neue Route") it.title = placeShort(ref); }
  else if (sid === "home") draft.home.place = ref;
  else if (sid === "wx") draft.place = { name: placeShort(ref), lat: ref.lat, lon: ref.lon };
  renderSheet();
}

sheet.addEventListener("input", (ev) => {
  const t = ev.target;
  if (!draft) return;
  if (t.classList.contains("sq")) {
    const sid = t.getAttribute("data-sid");
    clearTimeout(searchTimers[sid]);
    searchTimers[sid] = setTimeout(() => runSearch(sid, t.value.trim(), t.getAttribute("data-kinds")), 300);
    return;
  }
  const k = t.getAttribute("data-k");
  if (!k || t.type === "checkbox") return;
  const it = curItem();
  if (k === "b.title") { it.title = t.value; it.titleCustom = true; }
  else if (k === "b.lines") { it.lines = t.value; schedulePreview(); }
  else if (k === "r.title") it.title = t.value;
  else if (k === "r.start" || k === "r.end") it[k.slice(2)] = t.value;
  else if (k === "api") draft.api = t.value.trim().replace(/\/+$/, "");
  else if (k.indexOf("place.") === 0) draft.place[k.slice(6)] = t.value;
});
sheet.addEventListener("change", (ev) => {
  const t = ev.target;
  if (draft && t.getAttribute("data-k") === "nightDim") draft.nightDim = t.checked;
});

sheet.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-act]");
  if (!btn || !draft) return;
  const act = btn.getAttribute("data-act"), i = Number(btn.getAttribute("data-i"));
  const it = curItem();
  if (act === "cancel") closeSheet();
  else if (act === "tab") go({ tab: btn.getAttribute("data-tab"), edit: null });
  else if (act === "edit") go({ edit: { type: btn.getAttribute("data-t"), i } });
  else if (act === "back") go({ edit: null });
  else if (act === "add") {
    const t = btn.getAttribute("data-t");
    if (t === "board") { draft.boards.push(emptyBoard()); go({ edit: { type: "board", i: draft.boards.length - 1 } }); }
    else { draft.routes.push(emptyRoute()); go({ edit: { type: "route", i: draft.routes.length - 1 } }); }
  }
  else if (act === "mv") {
    const L = btn.getAttribute("data-t") === "board" ? draft.boards : draft.routes, j = i + Number(btn.getAttribute("data-d"));
    if (j >= 0 && j < L.length) { [L[i], L[j]] = [L[j], L[i]]; renderSheet(); }
  }
  else if (act === "delitem") {
    if (btn.classList.contains("armed")) {
      (ui.edit.type === "board" ? draft.boards : draft.routes).splice(ui.edit.i, 1);
      go({ edit: null });
    } else {
      const label = btn.textContent;
      btn.classList.add("armed"); btn.textContent = "Wirklich entfernen?";
      setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = label; } }, 4000);
    }
  }
  else if (act === "pickloc") {
    const x = (searchStore[btn.getAttribute("data-sid")] || [])[Number(btn.getAttribute("data-k"))];
    if (x) applyPick(btn.getAttribute("data-sid"), x);
  }
  else if (act === "clearvia") { it.via = null; autoTitle(it); renderSheet(); }
  else if (act === "fromhome") { it.from = null; renderSheet(); }
  else if (act === "wxhome") { const h = draft.home.place; draft.place = { name: placeShort(h), lat: h.lat, lon: h.lon }; renderSheet(); }
  else if (act === "step") {
    const p = btn.getAttribute("data-p"), [scope, key] = p.split(".");
    const obj = scope === "home" ? draft.home : it;
    const v = clamp((Number(obj[key]) || 0) + Number(btn.getAttribute("data-d")), Number(btn.getAttribute("data-min")), Number(btn.getAttribute("data-max")));
    obj[key] = key === "bike" && v === 0 ? "" : v;
    const out = $("o-" + p.replace(".", "-"));
    if (out) out.textContent = stepLabel(obj[key], btn.getAttribute("data-u"), btn.getAttribute("data-z"));
  }
  else if (act === "line") {
    const n = btn.getAttribute("data-l");
    let sel = parseLines(it.lines);
    sel = sel.indexOf(n) >= 0 ? sel.filter((x) => x !== n) : sel.concat(n);
    const order = lineCache.map((l) => l.n);
    sel.sort((a, c) => order.indexOf(a) - order.indexOf(c));
    it.lines = sel.join(", ");
    const prods = [];
    sel.forEach((s) => { const l = lineCache.find((x) => x.n === s); const p = l ? l.product : guessProduct(s); if (p && prods.indexOf(p) < 0) prods.push(p); });
    it.products = sel.length ? prods : [];
    btn.classList.toggle("on", sel.indexOf(n) >= 0);
    btn.setAttribute("aria-pressed", String(sel.indexOf(n) >= 0));
    autoTitle(it);
    schedulePreview();
  }
  else if (act === "rprod") {
    const p = btn.getAttribute("data-p");
    it.products = (it.products || []).indexOf(p) >= 0 ? it.products.filter((x) => x !== p) : (it.products || []).concat(p);
    btn.classList.toggle("on", it.products.indexOf(p) >= 0);
    schedulePreview(800);
  }
  else if (act === "day") {
    const d = Number(btn.getAttribute("data-d"));
    it.days = (it.days || []).indexOf(d) >= 0 ? it.days.filter((x) => x !== d) : (it.days || []).concat(d).sort((a, c) => a - c);
    btn.classList.toggle("on", it.days.indexOf(d) >= 0);
  }
  else if (act === "seg") {
    draft[btn.getAttribute("data-k")] = btn.getAttribute("data-v");
    btn.parentNode.querySelectorAll("button").forEach((b) => { const on = b === btn; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
  }
  else if (act === "save") {
    const lat = parseFloat(String(draft.place.lat).replace(",", ".")), lon = parseFloat(String(draft.place.lon).replace(",", "."));
    if (!(lat > 47 && lat < 56 && lon > 5 && lon < 16)) { sheetMsg = { text: "Der Ort für das Wetter liegt nicht in Deutschland. Bitte unter „Orte“ neu suchen." }; go({ tab: "places", edit: null }); return; }
    draft.place.lat = lat; draft.place.lon = lon;
    const badB = draft.boards.findIndex((b) => !b.stop);
    if (badB >= 0) { sheetMsg = { text: "Diese Tafel braucht noch eine Haltestelle." }; go({ tab: "boards", edit: { type: "board", i: badB } }); return; }
    const badR = draft.routes.findIndex((r) => !r.to);
    if (badR >= 0) { sheetMsg = { text: "Diese Route braucht noch ein Ziel." }; go({ tab: "routes", edit: { type: "route", i: badR } }); return; }
    draft.boards.forEach((b) => {
      b.walk = clamp(Number(b.walk) || 0, 0, 60);
      b.bike = b.bike === "" || b.bike == null || isNaN(Number(b.bike)) || Number(b.bike) <= 0 ? "" : clamp(Number(b.bike), 1, 60);
      b.count = clamp(Number(b.count) || 6, 1, 12);
      if (!String(b.title || "").trim()) b.title = placeShort(b.stop);
    });
    draft.routes.forEach((r) => {
      r.results = clamp(Number(r.results) || 3, 1, 4);
      r.walk = clamp(Number(r.walk) || 0, 0, 60);
      if (!String(r.title || "").trim()) r.title = placeShort(r.to) || "Route";
      if (!r.products || !r.products.length) r.products = ROUTE_PRODUCTS.slice();
    });
    draft.home.walk = clamp(Number(draft.home.walk) || 0, 0, 60);
    const placeChanged = draft.place.lat !== cfg.place.lat || draft.place.lon !== cfg.place.lon;
    cfg = normalizeConfig(draft); saveConfig(cfg); closeSheet();
    if (placeChanged) { weather.now = weather.hourly = weather.radar = weather.alerts = null; }
    state.routeSel = null;
    start();
  }
  else if (act === "copy") {
    const ta = $("exp");
    try { await navigator.clipboard.writeText(ta.value); btn.textContent = "Kopiert"; }
    catch (e) { ta.focus(); ta.select(); btn.textContent = "Text markiert, bitte kopieren"; }
  }
  else if (act === "import") {
    try {
      const c = JSON.parse($("imp").value);
      if (!c || !Array.isArray(c.boards)) throw new Error();
      draft = normalizeConfig(c);
      sheetMsg = { text: "Einstellungen eingelesen. Mit „Speichern“ übernehmen.", ok: true };
    } catch (e) { sheetMsg = { text: "Das eingefügte Format ist nicht lesbar. Bitte den kompletten gesicherten Text einfügen." }; }
    renderSheet();
  }
  else if (act === "forget") {
    if (btn.classList.contains("armed")) { try { localStorage.removeItem(UKEY); } catch (e) {} sheetMsg = { text: "Gezählte Klicks gelöscht.", ok: true }; renderSheet(); }
    else { btn.classList.add("armed"); btn.textContent = "Wirklich löschen?"; }
  }
  else if (act === "reset") {
    if (btn.classList.contains("armed")) { draft = clone(DEFAULTS); sheetMsg = { text: "Standard geladen. Mit „Speichern“ übernehmen.", ok: true }; go({ tab: "boards", edit: null }); }
    else { btn.classList.add("armed"); btn.textContent = "Wirklich zurücksetzen?"; }
  }
});
$("gear").addEventListener("click", openSheet);

start();
})();
</script>
